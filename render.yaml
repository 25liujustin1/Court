# Render blueprint for the rework's online server (rework-play/server.js).
# Render dashboard: New > Blueprint > pick this repo. The free plan sleeps after ~15 idle minutes; the first visit wakes it (about a minute).
services:
  - type: web
    name: court-rework
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node rework-play/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
