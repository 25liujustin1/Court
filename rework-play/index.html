<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Court Rework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Sans:wght@500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Same look as the playtest page (playtest/index.html): parchment, maroon small-caps headings, gold rules, green callouts. */
:root{
  --bg:#ede4cc; --surface:#f6f0e0; --sunk:#e4d9bc; --ink:#2b2118; --muted:#6c5e4b; --line:#d3c4a2;
  --accent:#6e1c12; --on-accent:#f8f1e2; --gold:#b8954f; --rule:#c8a96a; --danger:#9e2b1c; --ok:#3d6b2e;
  --callout:#dfe3c4; --callout-edge:#2b2118; --example:#f6f0e0;
  --c0:#b0281f; --c1:#2350a8; --c2:#1f7646; --c3:#a5600a; --c4:#6c3fa3; --c5:#11777a;
  --font-display:"Palatino Linotype","Book Antiqua",Palatino,"EB Garamond",Georgia,serif;
  --font-body:"Palatino Linotype","Book Antiqua",Palatino,"EB Garamond",Georgia,serif;
  --font-head:"Fira Sans","Segoe UI",system-ui,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1712; --surface:#28201a; --sunk:#15100c; --ink:#efe6d3; --muted:#b0a28b; --line:#45382b;
    --accent:#de8f7c; --on-accent:#1d0f0b; --gold:#d2ad66; --rule:#8f7442; --danger:#ec7a66; --ok:#8cc27a;
    --callout:#2d3220; --callout-edge:#cbbd9f; --example:#241c16;
    --c0:#f0635a; --c1:#76a2ff; --c2:#4fcf8c; --c3:#f2a640; --c4:#bb92f2; --c5:#43c9c9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1712; --surface:#28201a; --sunk:#15100c; --ink:#efe6d3; --muted:#b0a28b; --line:#45382b;
  --accent:#de8f7c; --on-accent:#1d0f0b; --gold:#d2ad66; --rule:#8f7442; --danger:#ec7a66; --ok:#8cc27a;
  --callout:#2d3220; --callout-edge:#cbbd9f; --example:#241c16;
  --c0:#f0635a; --c1:#76a2ff; --c2:#4fcf8c; --c3:#f2a640; --c4:#bb92f2; --c5:#43c9c9;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5; padding:0 16px 48px}
.wrap{max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:28px}
h1,h2,h3{font-family:var(--font-display); font-weight:400; font-variant:small-caps; color:var(--accent); margin:0; line-height:1.15}
h1{font-size:2.8rem; letter-spacing:.01em}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.label{font-family:var(--font-head); font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.masthead{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:18px 0 14px; border-bottom:2px solid var(--rule)}
.masthead .brand{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.masthead .brand span{color:var(--muted); font-style:italic}
.toolbar{display:flex; gap:8px; flex-wrap:wrap}
.btn{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:9px 14px; cursor:pointer; min-height:42px; text-align:left}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.btn.small{min-height:34px; padding:5px 10px; font-size:.9rem}
.btn .cost{font-family:var(--font-data); font-size:.82rem; color:var(--gold); margin-left:6px}
.btn.primary .cost{color:inherit; opacity:.85}
.btn .sub{display:block; font-size:.8rem; color:var(--muted)}
.btn.primary .sub{color:inherit; opacity:.85}
section{display:flex; flex-direction:column; gap:12px}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--rule); padding-bottom:6px}
select{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:6px 10px; min-height:38px}
.who{display:inline-flex; align-items:center; gap:6px; font-weight:700; white-space:nowrap}
.who i{width:11px; height:11px; border-radius:50%; background:var(--pc); flex:none; box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--pc)}
.tok{width:32px; height:32px; display:inline-block; flex:none; vertical-align:middle}
.toks{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.held{display:inline-flex; flex-wrap:wrap; gap:10px; align-items:center}
.held .grp{display:inline-flex; gap:3px; align-items:center}
.held .dot{width:12px; height:12px; border-radius:50%; background:var(--pc); display:inline-block}
.held .n{font-family:var(--font-data); font-size:.8rem; color:var(--muted); margin-left:2px}
/* identity callout */
.identity{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; padding:18px; background:var(--callout); border-top:2px solid var(--callout-edge); border-bottom:2px solid var(--callout-edge)}
.seal{width:104px; height:104px; border-radius:50%; border:3px double var(--pc); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-family:var(--font-display); font-size:1.15rem; line-height:1.05; padding:6px}
.seal small{font-family:var(--font-data); font-size:.7rem; color:var(--muted); margin-top:4px}
.identity .facts{display:flex; flex-direction:column; gap:6px; min-width:0}
.identity .facts .nm{font-family:var(--font-display); font-variant:small-caps; color:var(--accent); font-size:1.5rem}
.tag{display:inline-block; font-family:var(--font-head); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; font-weight:600; border:1px solid currentColor; border-radius:999px; padding:1px 8px; vertical-align:middle}
.tag.warn{color:var(--danger)} .tag.ok{color:var(--ok)} .tag.gold{color:var(--accent)}
.power{border-left:4px solid var(--accent); background:var(--example); padding:8px 12px; font-size:.95rem}
.banner{border-left:4px solid var(--accent); background:var(--example); font-style:italic; padding:10px 12px}
.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
.stat{border-top:2px solid var(--rule); padding-top:6px}
.stat .v{font-size:1.6rem; font-variant-numeric:tabular-nums lining-nums}
.stat .v.gold{color:var(--gold)}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .identity{grid-template-columns:1fr} }
.grid-actions{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px}
/* event cards */
.hand{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:18px 16px; padding:8px 8px 4px 0}
.ecard{position:relative; display:flex; flex-direction:column; gap:8px; min-height:170px; padding:14px 12px 12px; background:var(--surface); border:1.5px solid var(--accent); border-radius:10px;
  box-shadow:inset 0 0 0 4px var(--surface), inset 0 0 0 5px var(--rule), 0 2px 6px rgb(60 40 20 / .14)}
.ecard-name{font-family:var(--font-display); font-variant:small-caps; color:var(--accent); font-size:1.25rem; text-align:center; line-height:1.1}
.ecard-rule{border-top:1.5px solid var(--rule); margin:0 10px}
.ecard-text{font-size:.84rem; line-height:1.4; flex:1}
.ecard-count{position:absolute; top:-10px; right:-10px; min-width:28px; height:28px; padding:0 6px; border-radius:14px; background:var(--accent); color:var(--on-accent); font-family:var(--font-head); font-weight:600; font-size:.85rem; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--bg)}
/* ledger */
.ledger{overflow-x:auto}
.ledger table{border-collapse:collapse; width:100%; min-width:620px; font-size:.95rem; border-bottom:1.5px solid var(--accent)}
.ledger th{font-family:var(--font-head); font-size:.85rem; color:var(--ink); font-weight:600; text-align:left; padding:6px 8px; border-bottom:1.5px solid var(--accent)}
.ledger td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle}
.ledger td.n, .ledger th.n{text-align:right; font-variant-numeric:tabular-nums lining-nums}
.ledger tr.current td{background:var(--sunk)}
.ledger tr.out td{opacity:.55}
.ledger .sub{display:block; font-size:.8rem; color:var(--muted); font-weight:400}
.log{font-family:var(--font-data); font-size:.82rem; display:flex; flex-direction:column; gap:4px; max-height:320px; overflow:auto; border:1px solid var(--line); padding:10px; background:var(--surface)}
.log div{display:grid; grid-template-columns:2.6em minmax(0,1fr); gap:6px}
.log span{color:var(--muted)}
.log .mine b{color:var(--accent)}
.log .big b{color:var(--danger); font-weight:600}
.log .chat{grid-template-columns:auto minmax(0,1fr)}
.log .chat b{color:var(--ink); font-family:var(--font-body); font-size:.9rem}
.chatform{display:flex; gap:6px; margin-top:6px}
.chatform input{flex:1; min-width:0; font:inherit; padding:5px 8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:4px}
.toasts{position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:50; max-width:min(360px, calc(100vw - 32px))}
.toast{background:var(--surface); border:2px solid var(--accent); border-radius:8px; padding:10px 12px; box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.toast .row{margin-top:8px}
.roomcode{font-family:var(--font-data); font-size:1.6rem; letter-spacing:.2em; color:var(--accent)}
.seatlist{display:flex; flex-direction:column; gap:4px; margin:8px 0}
.online-box{border-top:1px solid var(--line); margin-top:12px; padding-top:10px}
.online-box input[type=text]{font:inherit; padding:5px 8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:4px; width:150px}
/* modal sheet */
dialog{border:1px solid var(--rule); border-radius:4px; background:var(--bg); color:var(--ink); width:calc(100% - 32px); max-width:580px; max-height:calc(100% - 32px); padding:20px}
dialog::backdrop{background:rgb(10 6 14 / .55)}
#dlgBody{display:flex; flex-direction:column; gap:14px}
.opts{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.opts.wide{grid-template-columns:1fr}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.names{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px}
button.namecell{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:8px 10px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:4px}
button.namecell:hover{border-color:var(--accent)}
button.namecell .tok{width:24px; height:24px}
.rules{font-size:.95rem; display:flex; flex-direction:column; gap:10px}
.ability{margin:2px 0}
details summary{cursor:pointer; font-family:var(--font-display); font-size:1.1rem; color:var(--accent)}
@media (prefers-reduced-motion:no-preference){ .identity{animation:rise .25s ease-out} @keyframes rise{from{transform:translateY(6px); opacity:.6} to{transform:none; opacity:1}} }

/* ---------- the court table ---------- */
:root{ --skin:#ead8b8; --skin-edge:#b89c74; --r0:#b8862b; --r1:#a3312a; --r2:#6b3d8f; --r3:#4d84b0; --r4:#3b7a45; --felt:#d9cba6; --felt-edge:#a8874a; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --skin:#c9b08c; --skin-edge:#8f7458; --r0:#e0b354; --r1:#e06a5f; --r2:#b58ad8; --r3:#8fb3d1; --r4:#79c486; --felt:#2f261d; --felt-edge:#8f7442; } }
:root[data-theme="dark"]{ --skin:#c9b08c; --skin-edge:#8f7458; --r0:#e0b354; --r1:#e06a5f; --r2:#b58ad8; --r3:#8fb3d1; --r4:#79c486; --felt:#2f261d; --felt-edge:#8f7442; }
.court{position:relative; width:100%; height:600px; margin-top:4px}
.court .felt{position:absolute; left:16%; right:16%; top:20%; bottom:20%; border-radius:50%; background:radial-gradient(ellipse at 50% 40%, var(--surface), var(--felt) 70%);
  border:3px solid var(--felt-edge); box-shadow:inset 0 0 0 8px var(--felt), inset 0 0 0 9px var(--rule), 0 6px 18px rgb(60 40 20 / .18)}
.court svg.links{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.court .center{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(var(--cs,1)); display:flex; gap:26px; align-items:flex-end}
.court .pile{display:flex; flex-direction:column; align-items:center; gap:4px; font-family:var(--font-head); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.court .pile b{font-family:var(--font-body); font-size:1.1rem; color:var(--ink); letter-spacing:0; text-transform:none}
.court .round-mark{position:absolute; left:50%; top:calc(20% + 26px); transform:translateX(-50%); font-family:var(--font-display); font-variant:small-caps; color:var(--accent); font-size:1.1rem; white-space:nowrap}
.court .noblesse{position:absolute; left:50%; bottom:calc(20% + 22px); transform:translateX(-50%); font-size:.8rem; color:var(--danger); font-style:italic; white-space:nowrap}
.seat{position:absolute; width:var(--sw,178px); transform:translate(-50%,-50%); background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--pc); border-radius:8px; padding:8px 10px 9px;
  box-shadow:0 2px 8px rgb(60 40 20 / .16); display:flex; flex-direction:column; gap:4px; font-size:.85rem; line-height:1.25}
.seat.turn{box-shadow:0 0 0 3px var(--gold), 0 0 22px 4px rgb(184 149 79 / .55)}
.seat.me{background:var(--callout)}
.seat.out{opacity:.5; border-style:dashed}
.seat .top{display:flex; align-items:center; gap:8px}
.seat .nm{font-weight:700; font-size:.98rem}
.seat .mask{width:34px; height:34px; flex:none}
.seat .avatar{width:56px; height:56px; flex:none; margin:-4px 0 -4px -2px}
.avatar.lpc{position:relative; display:inline-block; border-radius:6px; background:var(--sunk); overflow:hidden; box-shadow:inset 0 0 0 2px var(--pc)}
.avatar.lpc img{position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; pointer-events:none}
.avatar.lpc.revealed{box-shadow:inset 0 0 0 2px var(--pc), 0 0 0 2px var(--gold), 0 0 10px 2px rgb(184 149 79 / .6)}
.avatar.lpc.gone img{filter:grayscale(1) opacity(.35)}
.fx-lpcmask img{width:100%; image-rendering:pixelated; display:block}
.court.compact .seat .avatar{width:44px; height:44px}
.seat .avatar.gone{opacity:.7}
.fx-mask{height:auto}
.seat .souls{display:inline-flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums lining-nums}
.seat .souls svg{width:15px; height:15px}
.seat .line{display:flex; align-items:center; justify-content:space-between; gap:6px; min-height:18px}
.seat .st{font-size:.78rem; color:var(--muted); font-style:italic}
.seat .cardbacks{display:inline-flex}
.seat .cardbacks i{width:11px; height:15px; border-radius:2px; background:var(--accent); border:1px solid var(--surface); margin-left:-4px; box-shadow:0 0 0 .5px var(--accent)}
.seat .cardbacks i:first-child{margin-left:0}
.seat .held .dot{width:10px; height:10px}
.seat .soul-ic, .souls-big .soul-ic{width:15px; height:15px}
.seat .irons{width:15px; height:15px; vertical-align:-3px; margin-right:4px}
.seat .crown-ic{width:22px; height:22px; vertical-align:-5px; margin-right:3px}
.bagwrap{position:relative; display:inline-block; width:74px; height:74px}
.bagwrap .bag-ic{width:74px; height:74px}
.bagwrap b{position:absolute; left:0; right:0; top:44%; text-align:center; color:#f6f0e0; font-size:1.05rem; font-weight:400}
.seal.has-img{padding:0; overflow:hidden; background:var(--surface)}
.seal-img{width:100%; height:100%; object-fit:cover; object-position:50% 20%; display:block}
.seal-img.sigil, img.mini.sigil{object-fit:contain; padding:6px; background:#f6f0e0}
img.mini{width:38px; height:38px; border-radius:50%; object-fit:cover; object-position:50% 20%; border:1.5px solid var(--rule); flex:none; background:var(--surface)}
.demon{font-family:var(--font-display); font-variant:small-caps; color:var(--accent); font-weight:400}
.identity .facts .nm .demon{font-size:.95rem; color:var(--muted); margin-left:4px}
.seat .crown{font-family:var(--font-display); font-variant:small-caps; color:var(--gold); font-size:.95rem}
.court.compact .seat{font-size:.74rem; padding:6px 7px; gap:3px} .court.compact .seat .nm{font-size:.86rem} .court.compact .seat .mask{width:26px; height:26px}
#courtBase{position:absolute; inset:0}
#fx{position:absolute; inset:0; pointer-events:none; z-index:5; overflow:visible}
.fx{position:absolute; transform:translate(-50%,-50%); pointer-events:none; white-space:nowrap}
.fx-tok .tok{width:30px; height:30px; filter:drop-shadow(0 2px 3px rgb(0 0 0 / .3))}
.fx-gain{font-family:var(--font-display); font-size:1.5rem; color:var(--gold); text-shadow:0 1px 0 var(--surface), 0 0 8px var(--surface)}
.fx-dud{font-family:var(--font-display); font-style:italic; color:var(--muted); font-size:1.1rem; text-shadow:0 0 6px var(--surface)}
.fx-price{font-family:var(--font-display); color:var(--gold); margin-left:2px; font-size:1.1rem}
.fx-soul{width:18px; height:21px; vertical-align:-4px}
.fx-card{display:block; width:22px; height:30px; border-radius:3px; background:var(--accent); border:2px solid var(--surface); box-shadow:0 2px 4px rgb(0 0 0 / .3)}
.fx-cardface{display:block; font-family:var(--font-display); font-variant:small-caps; color:var(--accent); background:var(--surface); border:1.5px solid var(--accent); border-radius:5px; padding:4px 8px; box-shadow:0 2px 6px rgb(0 0 0 / .25)}
.fx-mask{width:46px; height:46px}
.fx-crown{width:56px; height:56px; filter:drop-shadow(0 0 8px rgb(184 149 79 / .8))}
.fx-swords{width:64px; height:64px; filter:drop-shadow(0 0 6px var(--surface))}
.fx-die{display:flex; flex-direction:column; align-items:center}
.fx-d20{width:86px; height:86px; filter:drop-shadow(0 3px 6px rgb(0 0 0 / .35))}
.fx-face{position:absolute; top:28px; left:0; right:0; text-align:center; font-family:var(--font-display); font-size:1.7rem; color:var(--on-accent); background:var(--accent); width:44px; margin:0 auto; border-radius:50%; line-height:44px; box-shadow:0 0 0 3px var(--surface)}
.fx-range{display:block; margin-top:4px; font-family:var(--font-head); font-size:.72rem; letter-spacing:.04em; color:var(--ink); background:var(--surface); padding:2px 8px; border-radius:10px; border:1px solid var(--rule)}
.fx-scroll{width:48px; height:48px}
.fx-guess{display:flex; align-items:center; gap:3px; background:var(--surface); border:1.5px solid var(--accent); border-radius:8px; padding:5px 8px; box-shadow:0 3px 10px rgb(0 0 0 / .25)}
.fx-guess .tok{width:22px; height:22px}
.fx-guess b{font-family:var(--font-display); font-variant:small-caps; color:var(--accent); margin-left:6px; font-weight:400}
.fx-guess em{font-style:normal; font-family:var(--font-head); font-weight:600; text-transform:uppercase; font-size:.75rem; letter-spacing:.08em; margin-left:8px; padding:2px 7px; border-radius:10px; color:#fff}
.fx-guess em.ok{background:var(--ok)} .fx-guess em.bad{background:var(--danger)}
.fx-chain{transform:none}
.fx-irons, .fx-devil{width:52px; height:52px; filter:drop-shadow(0 0 6px var(--surface))}
.caption span{display:inline-block; font-family:var(--font-display); font-variant:small-caps; font-size:1.35rem; color:var(--accent); background:var(--surface); border:1.5px solid var(--rule); border-radius:999px; padding:4px 18px; box-shadow:0 3px 12px rgb(60 40 20 / .2)}
.court-legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.8rem; color:var(--muted)}
.court-legend span{display:inline-flex; align-items:center; gap:5px}
/* ---------- one-screen layout: record | table | your panel ---------- */
body{padding-bottom:16px}
.wrap{max-width:1600px; gap:14px}
.masthead{padding:10px 0 8px}
h1{font-size:2.1rem}
.board{display:grid; grid-template-columns:minmax(230px,280px) minmax(0,1fr) minmax(320px,380px); gap:18px; align-items:stretch}
.col{min-width:0; display:flex; flex-direction:column; gap:14px}
@media (min-width:1100px){
  .board{height:calc(100vh - 92px)}
  .col.left, .col.right{overflow-y:auto; padding-right:4px}
  .col.mid .court{flex:1; height:auto; min-height:520px}
  .col.left .fill{flex:1; min-height:0}
  .col.left .log{flex:1; max-height:none}
}
@media (max-width:1099px){
  .board{grid-template-columns:1fr}
  .col.mid{order:1} .col.right{order:2} .col.left{order:3}
}
.col.right h3{font-size:1.15rem}
.col.right section{gap:8px}
.col.right .section-head{padding-bottom:3px}
.col.right .identity{grid-template-columns:auto 1fr; gap:12px; padding:10px 12px}
.col.right .seal{width:70px; height:70px; font-size:.92rem}
.col.right .identity .facts .nm{font-size:1.2rem}
.col.right .identity .tok{width:24px; height:24px}
.col.right .power{font-size:.85rem; padding:5px 9px}
.col.right .banner{padding:6px 10px; font-size:.9rem}
.col.right .stats{grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:8px!important}
.col.right .stat .v{font-size:1.15rem}
.col.right .stat .v[style]{font-size:.85rem!important; padding-top:3px!important}
.col.right .grid-actions{grid-template-columns:1fr 1fr; gap:6px}
.col.right .grid-actions .btn{min-height:0; padding:6px 9px; font-size:.88rem; line-height:1.25}
.col.right .grid-actions .btn .sub{font-size:.72rem}
.col.right .grid-actions .btn .cost{font-size:.72rem; margin-left:4px}
.col.right #actions > p{font-size:.78rem!important; margin-top:6px!important}
.col.right .tok{width:22px; height:22px}
.col.right .hand{grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:10px; padding:6px 6px 2px 0}
.col.right .ecard{min-height:0; padding:8px 8px 9px; gap:4px}
.col.right .ecard-name{font-size:1rem}
.col.right .ecard-text{font-size:.7rem; line-height:1.3}
.col.right .ecard-count{top:-8px; right:-8px; min-width:22px; height:22px; font-size:.75rem}
.souls-big{display:inline-flex; align-items:center; gap:4px; font-size:1.35rem; color:var(--gold); font-variant-numeric:tabular-nums lining-nums}
.souls-big svg{width:17px; height:17px}
.holding{gap:6px!important}
.hold-row{display:grid; grid-template-columns:52px 1fr; gap:8px; align-items:center}
.cardchips{display:flex; flex-wrap:wrap; gap:5px}
.cardchip{font-family:var(--font-display); font-variant:small-caps; color:var(--accent); border:1.5px solid var(--accent); border-radius:5px; padding:0 7px; background:var(--surface); font-size:.9rem; cursor:help}
.endrow{position:sticky; bottom:0; background:var(--bg); padding:8px 0 4px}
.endrow .btn{width:100%; text-align:center}
.col.left .log{font-size:.76rem}
.col.mid .court-legend{justify-content:center}
@media (max-width:700px){
  .court{height:640px}
  .court .felt{left:8%; right:8%; top:24%; bottom:24%}
  .seat{font-size:.75rem; padding:6px 7px}
  .seat .nm{font-size:.85rem} .seat .mask{width:34px; height:18px}
  .court .center{gap:14px; transform:translate(-50%,-50%) scale(.85)}
}
</style>
</head>

<div class="wrap" id="app">
  <header class="masthead">
    <div class="brand"><h1>Court</h1><span id="sub">rework playtest</span></div>
    <div class="toolbar">
      <button class="btn small" id="rulesBtn">Rules</button>
      <button class="btn small" id="abilBtn">Roles</button>
      <button class="btn small" id="ledgerBtn">Ledger</button>
      <button class="btn small" id="newBtn">New game</button>
    </div>
  </header>
  <div class="board">
    <aside class="col left">
      <section class="fill"><div class="section-head"><h2>Court record</h2><span class="label">newest first</span></div><div class="log" id="log"></div><form class="chatform" id="chatForm" hidden><input id="chatIn" maxlength="200" autocomplete="off" placeholder="Say something to the court"><button class="btn small">Send</button></form></section>
    </aside>
    <div class="col mid">

    </div>
    <aside class="col right">
      <div id="you"></div>
      <section id="actSec"><div class="section-head"><h3>Actions</h3><span class="label" id="actNote"></span></div><div id="actions"></div></section>
      <section class="holding"><div class="hold-row"><span class="label">Tokens</span><div id="myToks"></div></div><div class="hold-row"><span class="label">Cards</span><div id="myCards"></div></div></section>
      <div id="endRow" class="endrow"></div>
    </aside>
  </div>
  <div id="players" hidden></div>
</div>

  const col = blank ? 'var(--muted)' : pc(c), pos = { 1: [[16, 16]], 2: [[11, 11], [21, 21]], 3: [[10, 10], [16, 16], [22, 22]], 4: [[11, 11], [21, 11], [11, 21], [21, 21]] }[d] || [];
  return `<svg class="tok" viewBox="0 0 32 32" aria-label="${blank ? 'blank' : COLOR_NAMES[c] + (d ? ' ' + d : '')}"><circle cx="16" cy="16" r="14" fill="var(--surface)" stroke="${col}" stroke-width="3"/>${blank ? `<path d="M10 22 22 10" stroke="${col}" stroke-width="2"/>` : ''}${pos.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="${col}"/>`).join('')}</svg>`;
}
function heldDots(q) {
  const by = {}; for (const t of q.tokens) by[t.c] = (by[t.c] || 0) + 1;
  const show = G.opts.xray || G.over;
  const e = Object.entries(by);
  if (!e.length) return '<span class="muted">none</span>';
  return `<span class="held">${e.map(([c, n]) => `<span class="grp" title="${n} ${COLOR_NAMES[c]}">${Array.from({ length: n }, () => `<span class="dot" style="--pc:${pc(c)}"></span>`).join('')}${show ? `<span class="n">${q.tokens.filter(t => t.c === +c).map(t => t.d).join('')}</span>` : ''}</span>`).join('')}</span>`;
}

function log(s, cls = '', r = G.g.round) { G.log.push({ r, s, cls }); if (G.log.length > 400) G.log.shift(); renderLog(); }
function renderLog() {
  $('#log').innerHTML = G.log.slice().reverse().map(e => e.chat !== undefined
    ? `<div class="chat"><span>${who(e.chat, COLOR_NAMES[e.chat])}</span><b>${esc(e.s)}</b></div>`
    : `<div class="${e.cls}"><span>R${e.r}</span><b>${esc(e.s)}</b></div>`).join('');
  document.querySelectorAll('#log div:not(.mine):not(.big):not(.chat) b').forEach(b => b.style.fontWeight = '400');
}
function flushEngineLog(max = Infinity) {
  const g = G.g;
  while (g.log.length && max-- > 0) {
    let s = g.log.shift(); const rm = s.match(/^R(\d+) /), r = rm ? +rm[1] : g.round; s = s.replace(/^R\d+ /, '');
    const me = `P${G.me}`;
    s = s.replace(`(${me})`, '(yours)').replace(new RegExp(`\\ba ${me} token`, 'g'), 'one of your tokens').replace(new RegExp(`\\bfrom ${me} for`, 'g'), 'from you for')
      .replace(new RegExp(`(duels|names|against|from|on|enslaves|consumes|vassalizes) ${me}\\b`, 'g'), '$1 you').replace(new RegExp(`\\b${me}\\b`, 'g'), 'You');
    s = s.replace(/\bYou (buys|draws|duels|tries|plays|remasks|reveals|enslaves|consumes|vassalizes|reincarnates|trades|waits|discards|wins|loses their|lowers their|is)\b/g, (m, v) =>
      'You ' + ({ tries: 'try', 'loses their': 'lose your', 'lowers their': 'lower your', is: 'are', wins: 'win' }[v] || v.replace(/s$/, '')));
    s = s.replace(/: You win$/, ': you win');
    s = s.replace(/\bP(\d)\b/g, (m, i) => COLOR_NAMES[+i]);
    const big = /enslaves|consumes|name|Arrogation|reincarnates|swap|wins the game|Ward|last stand/.test(s);
    log(s, s.startsWith('You') || /\byou\b/.test(s) ? 'mine' : big ? 'big' : '', r);
  }
}

// ---------- commands: every action goes through here (solo: run on the local game; online: sent to the server) ----------
// Resolves with the command's result after its animations have played.
function doCmd(cmd, a = {}) {
  if (G.online) return Net.send(cmd, a);
  flushEngineLog(); G.cur = snap(G.g);
  const res = runCommand(G.g, ME(), cmd, a, G.ctx);
  return after().then(() => res);
}
const failed = r => { if (!r.ok) log(r.msg || 'That did not work.', 'mine'); return !r.ok; };

// ---------- turn loop ----------
async function advance() {
  if (G.over) return;
  const g = G.g, game = G;
  G.idx++;
  if (G.idx >= g.P.length) { G.idx = 0; g.round++; log(`Round ${g.round} begins.`); }
  const p = g.P[G.idx]; g.turnNo++;
  flushEngineLog(); G.cur = snap(g);
  if (p.id === G.me) {
    const wasWaiting = p.status === 'waiting';
    const go = g.beginTurn(p);
    await playQueue(); if (G !== game) return;
    if (!go) { render(); return setTimeout(advance, G.opts.speed); }
    G.myTurn = true;
    if (wasWaiting) { log(`You reincarnate with a new name: ${p.name.join('-')}: ${ROLES[p.role]}.`, 'mine'); p.needMask = true; render(); return chooseMask('You reincarnate: choose your mask', m => doCmd('chooseMask', { m }).then(render)); }
    log(`Your turn: +2 souls${p.status !== 'free' && p.master !== null ? `, tribute paid to ${COLOR_NAMES[p.master]}` : ''}.`, 'mine');
    render(); return;
  }
  G.myTurn = false; render();
  try { g.turn(p); } catch (err) { log('Engine error: ' + err.message, 'big'); console.error(err); }
  await playQueue(); if (G !== game) return;
  render();
  if (checkWin()) return;
  setTimeout(advance, Math.min(G.opts.speed, 400));
}
async function endMyTurn() {
  if (G.online) { G.myTurn = false; render(); Net.raw({ t: 'end' }); return; }
  const g = G.g, p = ME(), game = G;
  flushEngineLog(); G.cur = snap(g); G.myTurn = false;
  try { g.endTurn(p); } catch (err) { log('Engine error: ' + err.message, 'big'); console.error(err); }
  await playQueue(); if (G !== game) return;
  render();
  if (checkWin()) return;
  setTimeout(advance, Math.min(G.opts.speed, 400));
}
function checkWin() {
  if (G.over && G.online) return true;
  const w = G.g.winner();
  if (!w) return false;
  G.over = true; G.myTurn = false; render();
  log(w.id === G.me ? 'You win! Everyone else serves you.' : `${COLOR_NAMES[w.id]} wins the game.`, 'big');
  winDialog(w);
  return true;
}
function winDialog(w) {
  const names = G.g.P.map(q => `<tr><td>${who(q.id)}</td><td><span class="row" style="gap:8px;flex-wrap:nowrap">${q.name ? portrait(q.name, 'mini') + demonOf(q.name) + ` (${q.name.join('-')})` : ''}</span></td><td>${q.role !== null ? ROLES[q.role] : ''}</td><td class="muted">${q.id === G.me ? '' : seatLabel(q)}</td></tr>`).join('');
  const again = G.online ? (Net.isHost() ? '<button class="btn primary" onclick="closeDialog();Net.restart()">Back to the lobby</button>' : '<span class="muted">The host can start another game.</span>') : '<button class="btn primary" onclick="closeDialog();newGameDialog()">New game</button>';
  dialog(`<h2>${w ? (w.id === G.me ? 'You win' : COLOR_NAMES[w.id] + ' wins') : 'Game over'}</h2><p class="muted">Round ${G.g.round}.</p><div class="ledger"><table style="min-width:0">${names}</table></div>
    <div class="row">${again}<button class="btn" onclick="closeDialog()">Look at the board</button></div>`);
}
// what a seat is labelled with under its colour: online, the player's nickname (or "bot"); solo, the bot style if shown
function seatLabel(q) {
  if (G.online) { const s = G.seats && G.seats[q.id]; return s ? (s.bot ? 'bot' : esc(s.nick) + (s.connected ? '' : ' · away')) : ''; }
  return q.id === G.me ? '' : G.opts.showTypes ? q.bot.type : '';
}
async function after() { const game = G; await playQueue(); if (G !== game) return; render(); checkWin(); }

// ---------- rendering ----------
function statusText(g, q) {
  if (q.status === 'waiting') return `consumed<span class="sub">back in ${q.waitTurns ?? 0 ? 'after a turn' : 'next turn'}</span>`;
  if (q.status === 'slave') return `slave<span class="sub">of ${esc(COLOR_NAMES[q.master])}</span>`;
  if (q.status === 'vassal') return `vassal<span class="sub">of ${esc(COLOR_NAMES[q.master])}</span>`;
  const subs = g.subjects(q); return subs.length ? `free<span class="sub">rules ${subs.map(s => esc(COLOR_NAMES[s.id])).join(', ')}</span>` : 'free';
}
function maskText(g, q) {
  if (q.status === 'waiting') return '—';
  if (q.status === 'slave') return `${ROLES[q.mask]} mask<span class="sub">permanent</span>`;
  if (q.lv3) return `<b>${ROLES[q.role]}</b><span class="sub">role revealed</span>`;
  if (q.mask !== null) return `${ROLES[q.mask]} mask`;
  return `<span style="color:var(--danger)">unmasked</span><span class="sub">last: ${ROLES[q.lastMask]}</span>`;
}
function level(g, p) {
  if (p.status !== 'free') return null;
  if (p.lv3) return [p.role, 3];
  if (p.mask !== null) return [p.mask, 1];
  return [p.lastMask, 2];
}
function render() {
  const g = G.g, p = ME(), free = g.P.filter(q => g.free(q)).length;
  $('#sub').textContent = G.over ? `Round ${g.round} · game over` : `Round ${g.round}${g.noblesseOver() ? ' · Noblesse Oblige has ended' : ''}`;
  const lv = level(g, p);
  const tagMask = p.status === 'waiting' ? '<span class="tag">consumed</span>' : g.masked(p) ? `<span class="tag ok">${p.status === 'slave' ? 'slave · ' : ''}${ROLES[p.mask]} mask</span>` : p.lv3 ? '<span class="tag gold">role revealed</span>' : '<span class="tag warn">unmasked</span>';
  // compact "you" card: seal, name dots, souls, mask, current power, then what you hold
  const by = {}; for (const t of p.tokens) by[t.c] = (by[t.c] || 0) + 1;
  const cby = {}; for (const c of p.cards) cby[c] = (cby[c] || 0) + 1;
  $('#you').innerHTML = `
    <div class="identity" style="--pc:${pc(G.me)}">
      <div class="seal${p.status !== 'waiting' && portrait(p.name) ? ' has-img' : ''}" style="--pc:${pc(G.me)}" title="${p.status === 'waiting' ? '' : demonOf(p.name)}">${p.status === 'waiting' ? '—' : (portrait(p.name, 'seal-img') || ROLES[p.role] + '<small>' + p.name.join('') + '</small>')}</div>
      <div class="facts">
        <div class="row" style="justify-content:space-between; gap:6px"><span class="nm">${who(G.me, COLOR_NAMES[G.me])} <span class="demon">${p.status === 'waiting' ? '' : demonOf(p.name) + ' · ' + ROLES[p.role]}</span></span><span class="souls-big">${soulSvg}${p.souls}</span></div>
        <div class="toks">${p.status === 'waiting' ? '<span class="muted">waiting to reincarnate</span>' : p.name.map(d => tokSvg(G.me, d)).join('')} ${tagMask}</div>
        ${lv ? `<div class="power"><b>${ROLES[lv[0]]} Lv. ${lv[1]}</b> · ${ABIL[lv[0]][lv[1] - 1]}</div>` : `<div class="power muted">${p.status === 'slave' ? `You serve ${COLOR_NAMES[p.master]}: no mask power.` : p.status === 'vassal' ? `You are ${COLOR_NAMES[p.master]}'s vassal.` : 'Consumed: back after a turn with a new name.'}</div>`}
      </div>
    </div>`;
  $('#myToks').innerHTML = Object.keys(by).length ? `<div class="toks">${Object.entries(by).map(([c, n]) => `<span class="row" style="gap:3px">${Array.from({ length: n }, () => tokSvg(+c)).join('')}<span class="muted" style="font-size:.8rem;margin-right:8px">${COLOR_NAMES[c]}${+c === G.me ? ' (yours)' : ''}</span></span>`).join('')}</div>` : '<span class="muted" style="font-size:.85rem">none</span>';
  $('#myCards').innerHTML = Object.keys(cby).length ? `<div class="cardchips">${Object.entries(cby).map(([c, n]) => `<span class="cardchip" title="${esc(CARD_TEXT[c] || '')}">${c}${n > 1 ? ` ×${n}` : ''}</span>`).join('')}</div>` : '<span class="muted" style="font-size:.85rem">none</span>';
  // ledger
  $('#players').innerHTML = `<table><tr><th>Player</th><th>Status</th><th>Mask</th><th class="n">Souls</th><th class="n">Cards</th><th>Tokens held</th></tr>${g.P.map(q => `
    <tr class="${G.idx === q.id && !G.over ? 'current' : ''} ${q.status === 'waiting' ? 'out' : ''}">
      <td>${who(q.id)}${seatLabel(q) ? `<span class="sub">${seatLabel(q)}</span>` : ''}${(G.opts.xray || G.over) && q.id !== G.me && q.status !== 'waiting' && q.name ? `<span class="sub">${q.name.join('-')} · ${ROLES[q.role]}</span>` : ''}</td>
      <td>${statusText(g, q)}</td><td>${maskText(g, q)}</td><td class="n">${q.souls}</td><td class="n">${q.cards.length}</td><td>${heldDots(q)}</td></tr>`).join('')}</table>`;
  $('#bagLine').textContent = `${free} free player${free === 1 ? '' : 's'} · win with 30 souls once everyone else serves you`;
  renderActions(); renderLog(); renderTable();
}

// ---------- the court table ----------
const gi = (name, fill, cls = '', extra = '') => `<svg class="${cls}" viewBox="0 0 512 512" aria-hidden="true"><path d="${GI[name]}" fill="${fill}" ${extra}/></svg>`;
const maskSvg = (role, cls = 'mask') => gi('carnival-mask', `var(--r${role})`, cls);
const bareSvg = () => gi('carnival-mask', 'var(--danger)', 'mask', 'opacity=".28"');
const soulSvg = '<svg class="soul-ic" viewBox="0 0 13 15" aria-hidden="true"><path d="M6.5 0C9 3 12.5 6 12.5 9.5A6 6 0 0 1 .5 9.5C.5 6 4 3 6.5 0Z" fill="var(--gold)"/></svg>';
const bagSvg = n => `<span class="bagwrap">${gi('swap-bag', '#7a5a36', 'bag-ic')}<b>${n}</b></span>`;
const stackSvg = (n, face) => `<svg width="48" height="62" viewBox="0 0 48 62" aria-label="${face ? 'discard' : 'deck'}">${[4, 2, 0].map(o => `<rect x="${4 + o}" y="${4 + o}" width="36" height="50" rx="4" fill="${face ? 'var(--surface)' : 'var(--accent)'}" stroke="${face ? 'var(--accent)' : 'var(--surface)'}" stroke-width="1.5" opacity="${n ? 1 : .25}"/>`).join('')}<text x="22" y="34" text-anchor="middle" fill="${face ? 'var(--accent)' : 'var(--on-accent)'}" font-family="Palatino Linotype,Georgia,serif" font-size="15">${n}</text></svg>`;

// ---------- avatars: a bust with a face; masked = the mask over the eyes, unmasked = the feature of the mask's role ----------
// ---------- avatars: LPC pixel characters (art/lpc, built by art/lpc/build-lpc.cjs; credits in art/lpc/CREDITS.md) ----------
// masked = a plain mask in the colour of the role it shows; unmasked = the feature of that mask's role; revealed = the true role's feature with a glow
const LPC = { sexes: ['male', 'female'], skins: ['light', 'amber', 'bronze', 'lavender', 'blue', 'pale_green', 'zombie', 'taupe'], shirts: ['red', 'blue', 'green', 'orange', 'purple', 'teal'],
  hairs: ['bob', 'afro', 'lob', 'idol', 'curly_short', 'long_straight', 'natural', 'cowlick', 'dreadlocks_short'], hairColors: ['black', 'raven', 'dark_brown', 'chestnut', 'white', 'ash', 'red', 'purple', 'blue', 'platinum'],
  masks: ['gold', 'red', 'purple', 'blue', 'green'] };
const part = n => `<img src="art/lpc/parts/${n}.png" alt="" draggable="false">`;
function rollLooks(n) {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  return Array.from({ length: n }, () => ({ sex: pick(LPC.sexes), skin: pick(LPC.skins), hair: pick(LPC.hairs), hairColor: pick(LPC.hairColors) }));
}
function avatar(q, cls = 'avatar') {
  const L = (G.looks && G.looks[q.id]) || { sex: 'male', skin: 'light', hair: 'bob', hairColor: 'black' };
  if (q.status === 'waiting') return `<span class="${cls} lpc gone" aria-label="consumed">${part(`base_${L.sex}_${L.skin}`)}</span>`;
  const masked = q.status === 'slave' || q.mask !== null, role = q.lv3 ? q.role : q.lastMask;
  const under = [`base_${L.sex}_${L.skin}`, `shirt_${L.sex}_${LPC.shirts[q.id]}`];
  if (q.status === 'slave') under.push(`chain_${L.sex}_iron`);
  if (!masked && role === EARL) under.push(`chain_${L.sex}_gold`, `earrings_${L.sex}`);
  if (masked) under.push(`mask_${LPC.masks[q.mask]}`);
  const top = masked ? [] : [{ [ARCH]: 'thirdeye', [DUKE]: 'horns', [PRINCE]: 'circlet', [MARQ]: 'helm' }[role]].filter(Boolean);
  const layers = [...under, `hair_${L.hair}_${L.hairColor}`, ...top];
  return `<span class="${cls} lpc${q.lv3 ? ' revealed' : ''}" aria-label="${masked ? ROLES[q.mask] + ' mask' : 'unmasked'}">${layers.map(part).join('')}</span>`;
}

// seat width follows the table's width
function seatW() { const W = $('#court').clientWidth || 880; return Math.round(Math.max(118, Math.min(178, W * 0.23))); }
function seatPos(i, n) {
  // you at the bottom; the others clockwise round the table
  const k = (i - G.me + n) % n, a = Math.PI / 2 + (2 * Math.PI * k) / n;
  const narrow = matchMedia('(max-width:700px)').matches;
  let x = 50 + (narrow ? 34 : 40) * Math.cos(a); const y = 50 + (narrow ? 38 : 39) * Math.sin(a);
  // keep the whole seat inside the table area on narrow screens
  const W = $('#court').clientWidth || 880, half = seatW() / 2 + 4;
  x = Math.min(Math.max(x, 100 * half / W), 100 - 100 * half / W);
  return { x, y };
}
// a public snapshot of the table, so animations can show the court as it was at each step of a turn
function snap(g) { return snapView(g, G.idx, G.me, !G.online && (G.opts.xray || G.over)); }
function renderTable(v) {
  if (!v) v = G.view || snap(G.g);
  G.view = v;
  const n = v.P.length, el = $('#court'), base = $('#courtBase');
  const pos = v.P.map(q => seatPos(q.id, n));
  const subjectsOf = q => v.P.filter(s => s.master === q.id && (s.status === 'slave' || s.status === 'vassal'));
  // chains: slave -> master (dashed links), vassal -> Prince (gold cord)
  const links = v.P.filter(q => (q.status === 'slave' || q.status === 'vassal') && q.master !== null).map(q => {
    const a = pos[q.id], b = pos[q.master], slave = q.status === 'slave';
    return `<line x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%" stroke="${slave ? 'var(--muted)' : 'var(--gold)'}" stroke-width="${slave ? 4 : 2.5}" ${slave ? 'stroke-dasharray="9 5" stroke-linecap="round"' : ''} opacity=".85"/>`;
  }).join('');
  const seats = v.P.map(q => {
    const p = pos[q.id], me = q.id === G.me;
    let face, st;
    face = avatar(q);

// play queued events one by one, showing the table as it was before each; then the final state

// ---------- online play: the server (rework-play/server.js) runs the game; this page shows your view and sends your actions ----------
const store = { get(k) { try { return JSON.parse(localStorage.getItem('court-rework-' + k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem('court-rework-' + k, JSON.stringify(v)); } catch {} } };
const Net = {
  ws: null, code: null, seat: null, token: null, rid: 0, pending: new Map(), chain: Promise.resolve(), lobby: null, retry: null, wanted: false,
  available() { return location.protocol === 'http:' || location.protocol === 'https:'; },
  nick(v) { if (v !== undefined) store.set('nick', v); return store.get('nick') || ''; },
  linkCode() { return (new URLSearchParams(location.search).get('room') || '').toUpperCase().slice(0, 4); },
  isHost() { return !!(this.lobby && this.lobby.host === this.seat); },
  connect() {
    if (this.ws && this.ws.readyState <= 1) return this.ws.readyState === 1 ? Promise.resolve() : new Promise((res, rej) => { this.ws.addEventListener('open', () => res(), { once: true }); this.ws.addEventListener('error', () => rej(new Error('Could not reach the server.')), { once: true }); });
    return new Promise((res, rej) => {
      const ws = new WebSocket(location.origin.replace(/^http/, 'ws') + '/ws'); this.ws = ws;
      ws.onopen = () => res();
      ws.onerror = () => rej(new Error('Could not reach the server.'));
      ws.onmessage = e => { try { this.onMsg(JSON.parse(e.data)); } catch (err) { console.error(err); } };
      ws.onclose = () => this.onClose(ws);
    });
  },
  raw(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); },
  async create(nick) { this.wanted = true; await this.connect(); this.raw({ t: 'create', nick }); },
  async join(code, nick, token = null) { this.wanted = true; await this.connect(); const s = store.get('session') || {}; this.raw({ t: 'join', code, nick, token: token || (s.code === code ? s.token : null) }); },
  send(cmd, a) { return new Promise(res => { const rid = ++this.rid; this.pending.set(rid, res); this.raw({ t: 'cmd', rid, cmd, a }); }); },
  resolve(rid, res) { const f = this.pending.get(rid); if (f) { this.pending.delete(rid); f(res || { ok: false }); } },
  offer(dir, to, c, price) { this.raw({ t: 'offer', dir, to, c, price }); log(`Offer sent to ${COLOR_NAMES[to]}.`, 'mine'); },
  restart() { this.raw({ t: 'restart' }); },
  leave() { this.wanted = false; this.raw({ t: 'leave' }); store.set('session', null); if (this.ws) this.ws.close(); this.ws = null; this.code = null; this.lobby = null; },
  onClose(ws) {
    if (ws !== this.ws || !this.wanted) return;
    this.ws = null;
    if (G && G.online) log('Connection lost — reconnecting…', 'big');
    clearTimeout(this.retry);
    this.retry = setTimeout(() => { const s = store.get('session'); if (s && this.wanted) this.join(s.code, this.nick(), s.token).catch(() => this.onClose(null)); }, 2000);
  },
  onMsg(m) {
    switch (m.t) {
      case 'welcome': this.code = m.code; this.seat = m.seat; this.token = m.token; store.set('session', { code: m.code, token: m.token }); history.replaceState(null, '', '?room=' + m.code); break;
      case 'lobby': this.lobby = m; if (m.phase === 'lobby') lobbyDialog(); else if (G && G.online) { G.seats = m.seats; if (!G.busy) renderTable(); } break;
      case 'update': this.chain = this.chain.then(() => applyUpdate(m)).catch(err => console.error(err)); break;
      case 'offer': offerToast(m); break;
      case 'offerGone': { const el = document.querySelector(`.toast[data-offer="${m.id}"]`); if (el) el.remove(); break; }
      case 'note': if (G) log(m.text, 'mine'); break;
      case 'chat': if (G) { G.log.push({ chat: m.from, s: m.text, r: 0 }); renderLog(); } break;
      case 'error':
        if ($('#on-err')) $('#on-err').textContent = m.text; else if (G) log(m.text, 'big');
        if (m.fatal) { store.set('session', null); this.wanted = false; if (!(G && G.online) && !$('#on-err')) { newGameDialog(); if ($('#on-err')) $('#on-err').textContent = m.text; } }
        break;
    }
  },
};

// one update from the server: replay its events over the table, then show the new state
async function applyUpdate(m) {
  const fresh = !G || !G.online || G.gameId !== m.gameId;
  if (fresh) {
    if ($('#dlg').open) closeDialog();
    G = { online: true, gameId: m.gameId, q: [], cur: null, busy: false, ctx: {}, looks: m.looks, me: m.seat, idx: m.idx, over: false, myTurn: false, log: [], seats: m.seats, opts: { speed: store.get('speed') ?? 600, showTypes: false, xray: false } };
    $('#chatForm').hidden = false;
  }
  G.seats = m.seats;
  const wasMine = G.myTurn, g = hydrate(m.state);
  g.log = m.log.slice(); G.g = g; G.idx = m.idx; G.q = fresh ? [] : m.events; G.myTurn = false;
  if (fresh) { const p = ME(); log(`Room ${Net.code}: you are ${COLOR_NAMES[G.me]}. Your secret name is ${p.name.join('-')}: ${ROLES[p.role]}.`, 'mine'); }
  await playQueue();
  G.myTurn = m.myTurn; G.over = m.over;
  render();
  if (m.rid) Net.resolve(m.rid, m.res);
  const p = ME();
  if (G.myTurn && !wasMine) log(`Your turn: +2 souls${p.status !== 'free' && p.master !== null ? `, tribute paid to ${COLOR_NAMES[p.master]}` : ''}.`, 'mine');
  if (p.needMask && !$('#dlg').open && !G.maskAsked) {

  }
  if (m.over && !G.shownWin) { G.shownWin = true; const w = m.winner !== null ? G.g.P[m.winner] : null; log(w ? (w.id === G.me ? 'You win! Everyone else serves you.' : `${COLOR_NAMES[w.id]} wins the game.`) : 'The game ended.', 'big'); winDialog(w); }
}
$('#chatForm').onsubmit = e => { e.preventDefault(); const t = $('#chatIn').value.trim(); if (t) Net.raw({ t: 'chat', text: t }); $('#chatIn').value = ''; };

$('#newBtn').onclick = newGameDialog;
$('#rulesBtn').onclick = rulesDialog;
$('#abilBtn').onclick = rolesDialog;
$('#ledgerBtn').onclick = () => { if (!G) return; dialog('<h2>The court</h2><div class="ledger">' + $('#players').innerHTML + '</div><div class="row"><button class="btn" onclick="closeDialog()">Close</button></div>'); };
// rejoin a game in progress after a reload
(() => { const s = store.get('session'); if (Net.available() && s && s.code) Net.join(s.code, Net.nick() || 'Player', s.token).catch(() => newGameDialog()); else newGameDialog(); })();
</script>
</body>
</html>
