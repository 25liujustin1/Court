<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solomon's Court</title>
<link rel="icon" type="image/svg+xml" href="art/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Sans:wght@500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Same look as the playtest page (playtest/index.html): parchment, maroon small-caps headings, gold rules, green callouts. */
:root{
  --bg:#ede4cc; --surface:#f6f0e0; --sunk:#e4d9bc; --ink:#2b2118; --muted:#6c5e4b; --line:#d3c4a2;
  --accent:#6e1c12; --on-accent:#f8f1e2; --gold:#b8954f; --rule:#c8a96a; --danger:#9e2b1c; --ok:#3d6b2e;
  --you-tint:15%; --example:#f6f0e0;
  --c0:#b0281f; --c1:#2350a8; --c2:#1f7646; --c3:#a5600a; --c4:#6c3fa3; --c5:#11777a;
  --font-display:"Palatino Linotype","Book Antiqua",Palatino,"EB Garamond",Georgia,serif;
  --font-body:"Palatino Linotype","Book Antiqua",Palatino,"EB Garamond",Georgia,serif;
  --font-head:"Fira Sans","Segoe UI",system-ui,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1712; --surface:#28201a; --sunk:#15100c; --ink:#efe6d3; --muted:#b0a28b; --line:#45382b;
    --accent:#de8f7c; --on-accent:#1d0f0b; --gold:#d2ad66; --rule:#8f7442; --danger:#ec7a66; --ok:#8cc27a;
    --you-tint:24%; --example:#241c16;
    --c0:#f0635a; --c1:#76a2ff; --c2:#4fcf8c; --c3:#f2a640; --c4:#bb92f2; --c5:#43c9c9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1712; --surface:#28201a; --sunk:#15100c; --ink:#efe6d3; --muted:#b0a28b; --line:#45382b;
  --accent:#de8f7c; --on-accent:#1d0f0b; --gold:#d2ad66; --rule:#8f7442; --danger:#ec7a66; --ok:#8cc27a;
  --you-tint:24%; --example:#241c16;
  --c0:#f0635a; --c1:#76a2ff; --c2:#4fcf8c; --c3:#f2a640; --c4:#bb92f2; --c5:#43c9c9;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5; padding:0 16px 48px}
.wrap{max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:28px}
h1,h2,h3{font-family:var(--font-display); font-weight:400; font-variant:small-caps; color:var(--accent); margin:0; line-height:1.15}
h1{font-size:2.8rem; letter-spacing:.01em}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
.label{font-family:var(--font-head); font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.masthead{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:18px 0 14px}
.masthead .brand{grid-column:2; text-align:center}
.masthead #sub{grid-column:1; grid-row:1; color:var(--muted); font-style:italic}
.masthead .toolbar{grid-column:3; grid-row:1; justify-self:end}
@media (max-width:700px){ .masthead{grid-template-columns:1fr; justify-items:center; gap:6px} .masthead .brand, .masthead #sub, .masthead .toolbar{grid-column:1; grid-row:auto; justify-self:center} .masthead #sub:empty{display:none} }
.toolbar{display:flex; gap:8px; flex-wrap:wrap}
.btn{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:9px 14px; cursor:pointer; min-height:42px; text-align:left}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.btn.small{min-height:34px; padding:5px 10px; font-size:.9rem}
.btn .cost{font-family:var(--font-data); font-size:.82rem; color:var(--gold); margin-left:6px}
.btn.primary .cost{color:inherit; opacity:.85}
.btn .sub{display:block; font-size:.8rem; color:var(--muted)}
.btn.primary .sub{color:inherit; opacity:.85}
section{display:flex; flex-direction:column; gap:12px}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--rule); padding-bottom:6px}
select{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:6px 10px; min-height:38px}
.who{display:inline-flex; align-items:center; gap:6px; font-weight:700; white-space:nowrap}
.who i{width:11px; height:11px; border-radius:50%; background:var(--pc); flex:none; box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--pc)}
.tok{width:32px; height:32px; display:inline-block; flex:none; vertical-align:middle}
.toks{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.held{display:inline-flex; flex-wrap:wrap; gap:10px; align-items:center}
.held .grp{display:inline-flex; gap:3px; align-items:center}
.held .dot{width:12px; height:11px; background:var(--pc); display:inline-block; clip-path:polygon(50% 0, 100% 100%, 0 100%)}   /* a token: a small triangle */
.held .n{font-family:var(--font-data); font-size:.8rem; color:var(--muted); margin-left:2px}
/* identity callout */
/* your card, tinted with your player colour */
.identity{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; padding:18px; border-radius:12px;
  background:color-mix(in srgb, var(--pc) var(--you-tint), var(--surface)); border:1.5px solid color-mix(in srgb, var(--pc) 55%, var(--surface))}
.seal{width:104px; height:104px; border-radius:50%; border:3px double var(--pc); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-family:var(--font-display); font-size:1.15rem; line-height:1.05; padding:6px}
.seal small{font-family:var(--font-data); font-size:.7rem; color:var(--muted); margin-top:4px}
.identity .facts{display:flex; flex-direction:column; gap:6px; min-width:0}
.identity .facts .nm{font-family:var(--font-display); font-variant:small-caps; color:var(--accent); font-size:1.5rem}
.tag{display:inline-block; font-family:var(--font-head); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; font-weight:600; border:1px solid currentColor; border-radius:999px; padding:1px 8px; vertical-align:middle}
.tag.warn{color:var(--danger)} .tag.ok{color:var(--ok)} .tag.gold{color:var(--accent)}
.power{font-size:.95rem}   /* plain text inside your card, no block of its own */
.banner{border-left:4px solid var(--accent); background:var(--example); font-style:italic; padding:10px 12px}
.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
.stat{border-top:2px solid var(--rule); padding-top:6px}
.stat .v{font-size:1.6rem; font-variant-numeric:tabular-nums lining-nums}
.stat .v.gold{color:var(--gold)}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .identity{grid-template-columns:1fr} }
.grid-actions{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px}
/* event cards */
.hand{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:18px 16px; padding:8px 8px 4px 0}
.ecard{position:relative; display:flex; flex-direction:column; gap:8px; min-height:170px; padding:14px 12px 12px; background:var(--surface); border:1.5px solid var(--accent); border-radius:10px;
  box-shadow:inset 0 0 0 4px var(--surface), inset 0 0 0 5px var(--rule), 0 2px 6px rgb(60 40 20 / .14)}
.ecard-name{font-family:var(--font-display); font-variant:small-caps; color:var(--accent); font-size:1.25rem; text-align:center; line-height:1.1}
.ecard-rule{border-top:1.5px solid var(--rule); margin:0 10px}
.ecard-text{font-size:.84rem; line-height:1.4; flex:1}
.ecard-count{position:absolute; top:-10px; right:-10px; min-width:28px; height:28px; padding:0 6px; border-radius:14px; background:var(--accent); color:var(--on-accent); font-family:var(--font-head); font-weight:600; font-size:.85rem; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--bg)}
/* tables (the end-of-game list) */
.ledger{overflow-x:auto}
.ledger table{border-collapse:collapse; width:100%; min-width:620px; font-size:.95rem; border-bottom:1.5px solid var(--accent)}
.ledger th{font-family:var(--font-head); font-size:.85rem; color:var(--ink); font-weight:600; text-align:left; padding:6px 8px; border-bottom:1.5px solid var(--accent)}
.ledger td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle}
.ledger td.n, .ledger th.n{text-align:right; font-variant-numeric:tabular-nums lining-nums}
.ledger tr.current td{background:var(--sunk)}
.ledger tr.out td{opacity:.55}
.ledger .sub{display:block; font-size:.8rem; color:var(--muted); font-weight:400}
.log{font-family:var(--font-data); font-size:.82rem; display:flex; flex-direction:column; gap:4px; max-height:320px; overflow:auto; border:1px solid var(--line); padding:10px; background:var(--surface)}
.log div{display:grid; grid-template-columns:2.6em minmax(0,1fr); gap:6px}
.log span{color:var(--muted)}
.log .mine b{color:var(--accent)}
.log .big b{color:var(--danger); font-weight:600}
.log .chat{grid-template-columns:auto minmax(0,1fr)}
.log .chat b{color:var(--ink); font-family:var(--font-body); font-size:.9rem}
.chatform{display:flex; gap:6px; margin-top:6px}
.chatform input{flex:1; min-width:0; font:inherit; padding:5px 8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:4px}
/* the left column scrolls and would clip an outside focus ring: draw it inside the border instead */
.chatform input:focus-visible{outline:none; border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.toasts{position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:50; max-width:min(360px, calc(100vw - 32px))}
.toast{background:var(--surface); border:2px solid var(--accent); border-radius:8px; padding:10px 12px; box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.toast .row{margin-top:8px}
.roomcode{font-family:var(--font-data); font-size:1.6rem; letter-spacing:.2em; color:var(--accent)}
.seatlist{display:flex; flex-direction:column; gap:4px; margin:8px 0}
/* modal sheet */
dialog{border:1px solid var(--rule); border-radius:4px; background:var(--bg); color:var(--ink); width:calc(100% - 32px); max-width:580px; max-height:calc(100% - 32px); padding:20px}
dialog::backdrop{background:rgb(10 6 14 / .55)}
#dlgBody{display:flex; flex-direction:column; gap:14px}
.dlg-x{position:absolute; top:8px; right:10px; width:36px; height:36px; border:0; background:none; color:var(--muted); font-size:1.7rem; line-height:1; cursor:pointer; border-radius:4px}
.dlg-x:hover{color:var(--ink); background:var(--sunk)}
.dlg-x:focus-visible{outline:2px solid var(--accent)}
#dlgBody > .dlg-x + h2{padding-right:36px}
.opts{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.opts.wide{grid-template-columns:1fr}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.names{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px}
button.namecell{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:8px 10px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:4px}
button.namecell:hover{border-color:var(--accent)}
button.namecell .tok{width:24px; height:24px}
.rules{font-size:.95rem; display:flex; flex-direction:column; gap:10px}
.odds{border-collapse:collapse; width:100%; font-size:.88rem; font-variant-numeric:tabular-nums lining-nums}
.odds th{font-family:var(--font-head); font-size:.78rem; font-weight:600; text-align:left; padding:4px 8px; border-bottom:1.5px solid var(--accent)}
.odds td{padding:3px 8px; border-bottom:1px solid var(--line)}
.odds .n{text-align:right}
.odds tbody tr:nth-child(odd) td{background:var(--surface)}
.ability{margin:2px 0}
details summary{cursor:pointer; font-family:var(--font-display); font-size:1.1rem; color:var(--accent)}
@media (prefers-reduced-motion:no-preference){ .identity{animation:rise .25s ease-out} @keyframes rise{from{transform:translateY(6px); opacity:.6} to{transform:none; opacity:1}} }

/* ---------- the court table ---------- */
:root{ --skin:#ead8b8; --skin-edge:#b89c74; --r0:#b8862b; --r1:#a3312a; --r2:#6b3d8f; --r3:#4d84b0; --r4:#3b7a45; --felt:#d9cba6; --felt-edge:#a8874a; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --skin:#c9b08c; --skin-edge:#8f7458; --r0:#e0b354; --r1:#e06a5f; --r2:#b58ad8; --r3:#8fb3d1; --r4:#79c486; --felt:#2f261d; --felt-edge:#8f7442; } }
:root[data-theme="dark"]{ --skin:#c9b08c; --skin-edge:#8f7458; --r0:#e0b354; --r1:#e06a5f; --r2:#b58ad8; --r3:#8fb3d1; --r4:#79c486; --felt:#2f261d; --felt-edge:#8f7442; }
.court{position:relative; width:100%; height:720px; margin-top:4px}
.court .felt{position:absolute; left:var(--felt-x,26%); right:var(--felt-x,26%); top:var(--felt-y,31%); bottom:var(--felt-y,31%);   /* small enough that the seats sit around it, not on it */ border-radius:50%; background:radial-gradient(ellipse at 50% 40%, var(--surface), var(--felt) 70%);
  border:3px solid var(--felt-edge); box-shadow:inset 0 0 0 8px var(--felt), inset 0 0 0 9px var(--rule), 0 6px 18px rgb(60 40 20 / .18)}
.court svg.links{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.court .center{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(var(--cs,1)); display:flex; gap:26px; align-items:flex-end}
.court .pile{display:flex; flex-direction:column; align-items:center; gap:4px; font-family:var(--font-head); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.court .pile b{font-family:var(--font-body); font-size:1.1rem; color:var(--ink); letter-spacing:0; text-transform:none}
.court .round-mark{position:absolute; left:50%; top:calc(50% - 96px); transform:translateX(-50%); font-family:var(--font-display); font-variant:small-caps; color:var(--accent); font-size:1.1rem; white-space:nowrap}
.court .noblesse{position:absolute; left:50%; bottom:calc(var(--felt-y,31%) + 14px); transform:translateX(-50%); font-size:.8rem; color:var(--danger); font-style:italic; white-space:nowrap}
/* a seat has no box: the name (in the player's colour), the headshot, then souls, cards and tokens. A halo in the page colour keeps text readable over the chains. */
.seat{position:absolute; width:var(--sw,178px); transform:translate(-50%,-50%); padding:2px 4px; display:flex; flex-direction:column; gap:4px; font-size:.85rem; line-height:1.25;
  text-shadow:0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 6px var(--bg)}
.seat .nm{color:var(--pc)}
.seat.turn .avatar{outline:3px solid var(--gold); outline-offset:3px}   /* whose turn: a gold ring around the headshot (an outline, so it doesn't clash with the revealed glow) */
.seat.me .avatar.lpc:not(.revealed){box-shadow:inset 0 0 0 2px var(--pc), 0 0 14px 3px color-mix(in srgb, var(--pc) 45%, transparent)}   /* you: a soft halo in your colour */
.seat.out{opacity:.5}
.seat .top{text-align:center}
.seat .nm{font-weight:700; font-size:.98rem; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seat .top .st{text-align:center}
.seat .mask{width:34px; height:34px; flex:none}
.seat .avatar{width:var(--av,110px); height:var(--av,110px); flex:none; display:block; margin:2px auto 4px}   /* the headshot is the seat's main thing */
.seat > .st{text-align:center}
.avatar.lpc{position:relative; display:inline-block; border-radius:6px; background:var(--sunk); overflow:hidden; box-shadow:inset 0 0 0 2px var(--pc)}
.avatar.lpc img{position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; pointer-events:none}
.avatar.lpc.revealed{box-shadow:inset 0 0 0 2px var(--pc), 0 0 0 2px var(--gold), 0 0 10px 2px rgb(184 149 79 / .6)}
.avatar.lpc.gone img{filter:grayscale(1) opacity(.35)}
.fx-lpcmask img{width:100%; image-rendering:pixelated; display:block}
.seat .avatar.gone{opacity:.7}
.fx-mask{height:auto}
.seat .souls{display:inline-flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums lining-nums}
.seat .souls svg{width:15px; height:15px}
.seat .line{display:flex; align-items:center; justify-content:center; gap:10px; min-height:18px}   /* centred under the headshot */
.seat .st{font-size:.78rem; color:var(--muted); font-style:italic}
.seat .st.xray{font-style:normal; color:var(--accent); font-variant-numeric:tabular-nums}
.seat .cardbacks{display:inline-flex}
.seat .cardbacks i{width:11px; height:15px; border-radius:2px; background:var(--accent); border:1px solid var(--surface); margin-left:-4px; box-shadow:0 0 0 .5px var(--accent)}
.seat .cardbacks i:first-child{margin-left:0}
.seat .held .dot{width:11px; height:10px}
.seat .soul-ic, .souls-big .soul-ic{width:15px; height:15px}
.seat .irons{width:15px; height:15px; vertical-align:-3px; margin-right:4px}
.seat .crown-ic{width:22px; height:22px; vertical-align:-5px; margin-right:3px}
.bagwrap{position:relative; display:inline-block; width:74px; height:74px}
.bagwrap .bag-ic{width:74px; height:74px}
.bagwrap b{position:absolute; left:0; right:0; top:44%; text-align:center; color:#f6f0e0; font-size:1.05rem; font-weight:400}
.seal.has-img{padding:0; overflow:hidden; background:var(--surface)}
.seal-img{width:100%; height:100%; object-fit:cover; object-position:50% 20%; display:block}
.seal-img.sigil, img.mini.sigil{object-fit:contain; padding:6px; background:#f6f0e0}
img.mini{width:38px; height:38px; border-radius:50%; object-fit:cover; object-position:50% 20%; border:1.5px solid var(--rule); flex:none; background:var(--surface)}
.demon{font-family:var(--font-display); font-variant:small-caps; color:var(--accent); font-weight:400}
.identity .facts .nm .demon{font-size:.95rem; color:var(--muted); margin-left:4px}
.seat .crown{font-family:var(--font-display); font-variant:small-caps; color:var(--gold); font-size:.95rem}
.court.compact .seat{font-size:.74rem; padding:6px 7px; gap:3px} .court.compact .seat .nm{font-size:.86rem} .court.compact .seat .mask{width:26px; height:26px}
#courtBase{position:absolute; inset:0}
#fx{position:absolute; inset:0; pointer-events:none; z-index:5; overflow:visible}
.fx{position:absolute; transform:translate(-50%,-50%); pointer-events:none; white-space:nowrap}
.fx-tok .tok{width:30px; height:30px; filter:drop-shadow(0 2px 3px rgb(0 0 0 / .3))}
.fx-gain{font-family:var(--font-display); font-size:1.5rem; color:var(--gold); text-shadow:0 1px 0 var(--surface), 0 0 8px var(--surface)}
.fx-dud{font-family:var(--font-display); font-style:italic; color:var(--muted); font-size:1.1rem; text-shadow:0 0 6px var(--surface)}
.trade-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:8px 0}
@media (max-width:560px){ .trade-grid{grid-template-columns:1fr} }
.trade-col h3{margin:0 0 6px}
.trow{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 0; border-bottom:1px solid var(--line)}
.trow .tlabel{display:flex; align-items:center; gap:6px}
.trow .tlabel svg{width:20px; height:20px}
.trow .step{display:flex; align-items:center; gap:8px}
.trow .step b{min-width:22px; text-align:center}
.trow .step .btn{min-height:36px; min-width:36px; padding:4px 0; text-align:center}
.fx-price{font-family:var(--font-display); color:var(--gold); margin-left:2px; font-size:1.1rem}
.fx-soul{width:18px; height:21px; vertical-align:-4px}
.fx-card{display:block; width:22px; height:30px; border-radius:3px; background:var(--accent); border:2px solid var(--surface); box-shadow:0 2px 4px rgb(0 0 0 / .3)}
.fx-cardface{display:block; font-family:var(--font-display); font-variant:small-caps; color:var(--accent); background:var(--surface); border:1.5px solid var(--accent); border-radius:5px; padding:4px 8px; box-shadow:0 2px 6px rgb(0 0 0 / .25)}
.fx-mask{width:46px; height:46px}
.fx-crown{width:56px; height:56px; filter:drop-shadow(0 0 8px rgb(184 149 79 / .8))}
.fx-swords{width:64px; height:64px; filter:drop-shadow(0 0 6px var(--surface))}
.fx-die{display:flex; flex-direction:column; align-items:center}
.fx-d20{width:86px; height:86px; filter:drop-shadow(0 3px 6px rgb(0 0 0 / .35))}

function log(s, cls = '', r = G.g.round) { G.log.push({ r, s, cls }); if (G.log.length > 400) G.log.shift(); renderLog(); }
function renderLog() {

function flushEngineLog(max = Infinity) {

    const me = `P${G.me}`;
    s = s.replace(`(${me})`, '(yours)').replace(new RegExp(`\\ba ${me} token`, 'g'), 'one of your tokens').replace(new RegExp(`\\bfrom ${me} for`, 'g'), 'from you for')
      .replace(new RegExp(`(duels|names|against|from|on|enslaves|consumes|vassalizes|supports) ${me}\\b`, 'g'), '$1 you').replace(new RegExp(`\\b${me}\\b`, 'g'), 'You');
    s = s.replace(/\bYou (supports|buys|draws|duels|tries|plays|remasks|reveals|enslaves|consumes|vassalizes|reincarnates|trades|waits|discards|wins|loses their|lowers their|is)\b/g, (m, v) =>
      'You ' + ({ supports: 'support', tries: 'try', 'loses their': 'lose your', 'lowers their': 'lower your', is: 'are', wins: 'win' }[v] || v.replace(/s$/, '')));

    log(s, s.startsWith('You') || /\byou\b/.test(s) ? 'mine' : big ? 'big' : '', r);

// ---------- commands: every action goes through here (solo: run on the local game; online: sent to the server) ----------
// Resolves with the command's result after its animations have played.
function doCmd(cmd, a = {}) {
  if (G.online) return Net.send(cmd, a);
  flushEngineLog(); G.cur = snap(G.g);
  const res = runCommand(G.g, ME(), cmd, a, G.ctx);
  return after().then(() => res);
}

// Solo, a pop-up and the game waits; online, a panel with a timer (the server rolls without you when it runs out).
function backingHTML(req, w) {
  const label = req.kind === 'rebellion' ? 'Arrogation' : req.kind === 'last stand' ? 'Last stand' : 'Duel';
  const max = Math.max(1, Math.min(w.souls, req.cap));
  return `<h2>${label}: ${who(req.a)} vs ${who(req.d)}</h2>
    <p class="muted">Before the roll, you may support a side with souls. If your side wins you get them back; if it loses, they go to the winner. Each side can take up to ${req.cap} soul${req.cap === 1 ? '' : 's'} of support in all.</p>
    <div class="back-sides">${['a', 'd'].map(sd => { const id = req[sd], ok = w.sides.includes(sd);
      return `<label class="back-side ${ok ? '' : 'off'}"><input type="radio" name="bk-side-${req.fno}" class="bk-side" value="${sd}" ${ok ? '' : 'disabled'}><span>${who(id)}</span><b data-odds="${sd}"></b><small>${Math.round(sd === 'a' ? req.sa : req.sd)} strength${ok ? '' : ' · your master: you can\'t act against them'}</small></label>`; }).join('')}</div>
    <div class="row"><span class="label">Souls</span><button class="btn small" data-bk="-1">−</button><b class="bk-amt">${Math.min(2, max)}</b><button class="btn small" data-bk="1">+</button><span class="muted">of ${w.souls}</span></div>
    <div class="row"><button class="btn primary bk-go" data-y="1" disabled>Support</button><button class="btn bk-pass" data-y="0">Pass</button><span class="muted bk-timer"></span></div>`;
}

function wireBacking(root, req, w, done) {

    root.querySelector('[data-odds="a"]').textContent = `${Math.round(pa * 100)}%`; root.querySelector('[data-odds="d"]').textContent = `${Math.round(100 - pa * 100)}%`;

// ---------- turn loop ----------
async function advance() {
  if (G.over) return;
  const g = G.g, game = G;
  G.idx++;
  if (G.idx >= g.P.length) { G.idx = 0; g.round++; log(`Round ${g.round} begins.`); }
  const p = g.P[G.idx]; g.turnNo++;
  flushEngineLog(); G.cur = snap(g);
  if (p.id === G.me) {
    const wasWaiting = p.status === 'waiting';
    const go = g.beginTurn(p);
    await playQueue(); if (G !== game) return;
    if (!go) { render(); return setTimeout(advance, G.opts.speed); }
    G.myTurn = true;
    if (wasWaiting) { log(`You reincarnate with a new name: ${p.name.join('-')}: ${ROLES[p.role]}.`, 'mine'); p.needMask = true; render(); return chooseMask('You reincarnate: choose your mask', m => doCmd('chooseMask', { m }).then(render)); }
    log(`Your turn: +${G.g.C.INCOME} souls${p.status !== 'free' && p.master !== null ? `, tribute paid to ${COLOR_NAMES[p.master]}` : ''}.`, 'mine');
    render(); return;
  }
  G.myTurn = false; render();
  try { await withBacking(g, G.ctx, gg => gg.turn(gg.P[p.id]), askBacking); } catch (err) { log('Engine error: ' + err.message, 'big'); console.error(err); }
  if (G !== game) return;
  await playQueue(); if (G !== game) return;
  render();
  if (checkWin()) return;
  setTimeout(advance, Math.min(G.opts.speed, 400));
}
async function endMyTurn() {
  if (G.online) { G.myTurn = false; render(); Net.raw({ t: 'end' }); return; }
  const g = G.g, p = ME(), game = G;
  flushEngineLog(); G.cur = snap(g); G.myTurn = false;
  try { await withBacking(g, G.ctx, gg => gg.endTurn(gg.P[p.id]), askBacking); } catch (err) { log('Engine error: ' + err.message, 'big'); console.error(err); }
  if (G !== game) return;
  await playQueue(); if (G !== game) return;
  render();
  if (checkWin()) return;
  setTimeout(advance, Math.min(G.opts.speed, 400));
}
function checkWin() {
  if (G.over && G.online) return true;
  const w = G.g.winner();
  if (!w) return false;
  G.over = true; G.myTurn = false; render();
  log(w.id === G.me ? 'You win! Everyone else serves you.' : `${COLOR_NAMES[w.id]} wins the game.`, 'big');
  winDialog(w);
  return true;
}

  dialog(`<h2>${w ? (w.id === G.me ? 'You win' : COLOR_NAMES[w.id] + ' wins') : 'Game over'}</h2><p class="muted">Round ${G.g.round}.</p><div class="ledger"><table style="min-width:0">${names}</table></div>
    <div class="row">${again}<button class="btn" onclick="closeDialog()">Look at the board</button></div>`);

// ---------- the court table ----------
const gi = (name, fill, cls = '', extra = '') => `<svg class="${cls}" viewBox="0 0 512 512" aria-hidden="true"><path d="${GI[name]}" fill="${fill}" ${extra}/></svg>`;

const soulSvg = '<svg class="soul-ic" viewBox="0 0 13 15" aria-hidden="true"><path d="M6.5 0C9 3 12.5 6 12.5 9.5A6 6 0 0 1 .5 9.5C.5 6 4 3 6.5 0Z" fill="var(--gold)"/></svg>';
const bagSvg = n => `<span class="bagwrap">${gi('swap-bag', '#7a5a36', 'bag-ic')}<b>${n}</b></span>`;
const stackSvg = (n, face) => `<svg width="48" height="62" viewBox="0 0 48 62" aria-label="${face ? 'discard' : 'deck'}">${[4, 2, 0].map(o => `<rect x="${4 + o}" y="${4 + o}" width="36" height="50" rx="4" fill="${face ? 'var(--surface)' : 'var(--accent)'}" stroke="${face ? 'var(--accent)' : 'var(--surface)'}" stroke-width="1.5" opacity="${n ? 1 : .25}"/>`).join('')}<text x="22" y="34" text-anchor="middle" fill="${face ? 'var(--accent)' : 'var(--on-accent)'}" font-family="Palatino Linotype,Georgia,serif" font-size="15">${n}</text></svg>`;

// ---------- avatars: a bust with a face; masked = the mask over the eyes, unmasked = the feature of the mask's role ----------
// ---------- avatars: LPC pixel characters (art/lpc, built by art/lpc/build-lpc.cjs; credits in art/lpc/CREDITS.md) ----------
// masked = a plain mask in the colour of the role it shows; unmasked = the feature of the mask's role (never the true role: that would give it away);
// revealed = the true role's two features, with a glow. Ears match the hair; bat wings are black, feathered wings white; skin is any colour, tinted with an SVG filter.
const LPC = { bodies: ['male', 'female', 'muscular', 'teen'],   // outfit: black coat, white cravat, black pants
    // a teen gets either head: body key teen_m or teen_f (see build-lpc.cjs)
    // everyone wears a black coat, white cravat and black pants; released demons wear nothing. The seat's colour is the avatar's frame
  hairs: ['page', 'wavy', 'princess', 'sara'], hairColors: ['black', 'white', 'red', 'orange', 'blonde', 'chestnut'], eyes: ['red', 'gold', 'black'],
  masks: ['black', 'maroon', 'gold', 'sky', 'forest'] };   // Archduke Duke Prince Marquis Earl
const FEATURE = { [ARCH]: ['ears'], [DUKE]: ['horns_straight'], [PRINCE]: ['wings_feathered'], [MARQ]: ['horns_curved'], [EARL]: ['wings_bat'] };
const REVEALED = { [ARCH]: ['ears', 'wings_bat'], [DUKE]: ['horns_straight', 'wings_feathered'], [PRINCE]: ['wings_feathered', 'ears'], [MARQ]: ['horns_curved', 'wings_bat'], [EARL]: ['wings_bat', 'horns_straight'] };
// a random skin: any hue; s = saturation, k = how light (scales the lightness of the grey skin layer)
// a vivid demon skin, kept out of the human range: no hue between 355 and 50 (reds, oranges and browns that read as human skin), and saturated
const rollSkin = (r = Math.random) => ({ h: Math.floor(50 + r() * 305), s: Math.round(45 + r() * 45) / 100, k: Math.round(50 + r() * 50) / 100 });
// a natural human skin tone (pale to deep brown), worn until the demon is released; then its vivid skin shows
const rollNatural = (r = Math.random) => ({ h: Math.floor(16 + r() * 16), s: Math.round(30 + r() * 30) / 100, k: Math.round(40 + r() * 62) / 100 });
function hslRgb(h, s, l) { const f = n => { const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); }; return [f(0), f(8), f(4)]; }
// an SVG filter that maps the grey skin layer to the skin colour (made once per skin)
function skinFilter(S) {
  if (!S || typeof S !== 'object') S = { h: 25, s: 0.55, k: 1 };
  const id = `skin-${S.h}-${Math.round(S.s * 100)}-${Math.round(S.k * 100)}`;
  if (!document.getElementById(id)) {
    let box = document.getElementById('skinDefs');
    if (!box) { document.body.insertAdjacentHTML('beforeend', '<svg id="skinDefs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs></defs></svg>'); box = document.getElementById('skinDefs'); }
    const ch = [[], [], []];
    for (let i = 0; i <= 16; i++) hslRgb(S.h, S.s, Math.min(0.96, (i / 16) * S.k)).forEach((v, j) => ch[j].push(v.toFixed(3)));
    box.firstChild.insertAdjacentHTML('beforeend', `<filter id="${id}" color-interpolation-filters="sRGB"><feComponentTransfer>${['R', 'G', 'B'].map((c, j) => `<feFunc${c} type="table" tableValues="${ch[j].join(' ')}"/>`).join('')}</feComponentTransfer></filter>`);
  }
  return id;
}
const part = n => `<img src="art/lpc/parts/${n}.png" alt="" draggable="false">`;
const bodyKey = (b, pick) => b === 'teen' ? pick(['teen_m', 'teen_f']) : b;
function rollLooks(n) {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  return Array.from({ length: n }, () => ({ body: bodyKey(pick(LPC.bodies), pick), skin: rollSkin(), natural: rollNatural(), eyes: pick(LPC.eyes), hair: pick(LPC.hairs), hairColor: pick(LPC.hairColors) }));
}
function avatar(q, cls = 'avatar', look = null) {
  const L = look || (G && G.looks && G.looks[q.id]) || { body: 'male', skin: null, hair: 'page', hairColor: 'black' };
  if (q.status === 'waiting') return `<span class="${cls} lpc gone" aria-label="consumed">${part(`skin_${L.body}`)}${part(`face_${L.body}_${L.eyes || 'black'}`)}</span>`;
  const masked = q.status === 'slave' || q.mask !== null, hc = L.hairColor;
  const feats = masked ? [] : q.lv3 ? REVEALED[q.role] : (FEATURE[q.lastMask] || []);
  const back = feats.filter(f => f.startsWith('wings'));
  const front = [...feats.filter(f => f.startsWith('horns')), ...feats.filter(f => f === 'ears').map(() => `ears_${hc}`)];
  // a released (revealed) demon wears nothing while unmasked; remasking puts the coat, cravat and pants back on
  const released = q.lv3 && !masked;
  const mid = [`face_${L.body}_${L.eyes || 'black'}`, ...(released ? [] : [`pants_${L.body}`, `shirt_${L.body}_black`, `cravat_${L.body}_${masked ? 'white' : 'maroon'}`])];   // the cravat turns maroon once the mask is down
  if (q.status === 'slave') mid.push(`chain_${L.body}_iron`);
  if (masked) mid.push(`mask_${LPC.masks[q.mask]}`);

    if (p.mask !== null) A.push(act('Lower your mask', `+${g.C.UNMASK_GAIN} souls`, `Your own tokens go back to the bag, +${g.C.RETURN_GAIN} each`, true, '', simple('unmask')));
    else A.push(act('Remask', `${g.remaskCost(p)} souls`, 'Choose any mask your role allows', p.souls >= g.remaskCost(p) && !(g.C.END_UNMASK && g.noblesseOver()), g.noblesseOver() ? 'Noblesse Oblige has ended: no masks' : 'not enough souls',

    if (g.has(p, ARCH, 2) && !p.arch2) A.push(act('Archduke: draw 3, keep 1', '2 souls', 'Doesn\'t use a buy', p.souls >= 2, 'not enough souls', () => draw3('arch')));

    if (g.has(p, EARL, 3) && !p.earlFree) A.push(act('Earl: free event card', 'free', 'Top of the deck', true, '', simple('earlFree', {}, r => log(`You take ${r.card || 'nothing'}.`, 'mine'))));
    if (p.role === EARL && g.hasCard(p, 'Arrogation', 2) && !g.masked(p)) A.push(act('Earl: discard 2 Arrogation', '+7 souls', 'Reveals you are an Earl', true, '', simple('earlArrogation')));

      () => { if (confirm(`Consume ${COLOR_NAMES[s.id]}? You take half their souls and their cards; they come back later with a new name.`)) simple('consume', { s: s.id })(); }));
  } else if (p.status === 'slave' || p.status === 'vassal') {
    if (g.hasCard(p, 'Arrogation')) A.push(act(`Play Arrogation`, `${Math.round(100 * winChance(g.strength(p, 'att'), g.strength(g.P[p.master], 'def')))}%`, `Duel ${COLOR_NAMES[p.master]}: win to swap places, lose half your souls`, !p.soulsIn, 'you received souls in a trade: no Arrogation until your turn ends',
      simple('rebel', {}, r => log(r.won ? 'Your rebellion succeeds!' : 'Your rebellion fails: your master takes half your souls.', 'mine')), true));
    if (p.status === 'vassal' && g.C.VASSAL_FREE === 'flat') A.push(act('Buy your freedom', `${g.C.FREEDOM_COST} souls`, '', p.souls >= g.C.FREEDOM_COST, 'not enough souls', simple('buyFreedom')));
    if (p.status === 'vassal' && g.C.VASSAL_FREE === 'buyback') { const held = g.count(g.P[p.master], p.id);
      A.push(act('Buy back a token', `${g.C.BUYBACK_COST} souls`, `From ${COLOR_NAMES[p.master]}, who holds ${held} of yours; you are free once they hold fewer than ${g.C.VASSAL_HOLD}`, p.souls >= g.C.BUYBACK_COST && held > 0, held ? 'not enough souls' : 'they hold none of your tokens', simple('buyBack'))); }
  }
  el.innerHTML = '<div class="grid-actions">' + A.map((a, i) => `<button data-i="${i}" class="btn ${a.primary ? 'primary' : ''}" ${a.ok ? '' : 'disabled'} title="${esc(a.ok ? a.sub || '' : a.why || a.sub || '')}">${esc(a.label)}${a.cost ? `<span class="cost">${esc(a.cost)}</span>` : ''}</button>`).join('') + '</div>';
  el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { if (!G.myTurn || G.over || G.busy) return; try { A[+b.dataset.i].fn(); } catch (err) { log('Error: ' + err.message, 'big'); console.error(err); } });
  $('#endRow').innerHTML = `<button class="btn primary" id="endBtn">End turn</button>`;
  $('#endBtn').onclick = () => { if (G.myTurn && !G.over && !G.busy) endMyTurn(); };
}

function dialog(html, closable = false) { $('#dlgBody').innerHTML = (closable ? '<button class="dlg-x" aria-label="Close" title="Close" onclick="closeDialog()">&times;</button>' : '') + html; const d = $('#dlg'); if (!d.open) d.showModal(); }

function pickOne(title, desc, options, onPick, cancel = true, wide = false) {   // options: [{label, value, disabled, note}]

async function draw3(kind) {

    look.map((t, i) => ({ label: `${tokSvg(t.c ?? 0, 0, t.blank)} ${t.blank ? 'Blank' : COLOR_NAMES[t.c]}`, value: i, disabled: !t.keep, note: t.blank ? 'blank' : !t.live ? 'dead: discarded' : !t.keep ? "you can't keep this" : '' })), finish, false);

function choosePlayerColour(title, players, colourFilter, onPick) {

// ---------- trading: any mix of souls, name tokens (by colour, face down) and event cards, either way ----------

function tradeStart() {
  const g = G.g, p = ME();
  pickOne('Trade with…', '', g.P.filter(q => q !== p && g.alive(q)).map(q => ({ label: who(q.id), value: q.id,
    note: `${q.souls} souls · ${q.tokens.length} tokens · ${q.cards.length} cards${G.online && q.bot.human ? ' · a player: they get your offer' : ''}` })),
    id => tradeDialog(id, { souls: 0, tokens: {}, cards: {} }, { souls: 0, tokens: {}, cards: {} }), true, true);

// T = { souls, tokens: {colour: n}, cards: {name: n} } for each side, as the dialog builds it
const dealOf = T => ({ souls: T.souls, tokens: Object.entries(T.tokens).flatMap(([c, n]) => Array(n).fill(+c)), cards: Object.entries(T.cards).flatMap(([c, n]) => Array(n).fill(c)) });
function tradeDialog(qid, give, get) {
  const g = G.g, p = ME(), q = g.P[qid];
  const total = o => Object.values(o).reduce((a, b) => a + b, 0);
  // one side's rows: [key, label, value, max]
  const rows = (T, from, to, hidden) => {
    const R = [['souls', `${soulSvg} Souls`, T.souls, from.souls]];
    for (const c of [...new Set(from.tokens.map(t => t.c))].sort((a, b) => a - b)) if (g.canPass(from, to, c)) R.push([`t${c}`, `${tokSvg(c)} ${COLOR_NAMES[c]}`, T.tokens[c] || 0, g.count(from, c)]);
    if (hidden) { const left = from.cards.length - total(T.cards); if (from.cards.length) for (const c of CARD_NAMES) R.push([`c${c}`, c, T.cards[c] || 0, (T.cards[c] || 0) + left]); }
    else for (const c of CARD_NAMES) { const n = from.cards.filter(x => x === c).length; if (n) R.push([`c${c}`, c, T.cards[c] || 0, n]); }
    return R;
  };
  const col = (title, side, T, from, to, hidden, note) => `<div class="trade-col"><h3>${title}</h3>${note ? `<p class="muted">${note}</p>` : ''}${rows(T, from, to, hidden).map(([k, label, v, max]) =>
    `<div class="trow"><span class="tlabel">${label}</span><span class="step"><button class="btn small" data-s="${side}" data-k="${k}" data-d="-1" ${v > 0 ? '' : 'disabled'}>−</button><b>${v}</b><button class="btn small" data-s="${side}" data-k="${k}" data-d="1" ${v < max ? '' : 'disabled'}>+</button></span></div>`).join('')}</div>`;
  const G1 = dealOf(give), G2 = dealOf(get), ok = g.dealOk(p, q, G1, G2, true);
  const gift = !G2.souls && !G2.tokens.length && !G2.cards.length;
  dialog(`<h2>Trade with ${who(q.id)}</h2>
    <div class="trade-grid">${col('You give', 'give', give, p, q, false, '')}${col('You get', 'get', get, q, p, true, q.cards.length ? `Their ${q.cards.length} card${q.cards.length > 1 ? 's are' : ' is'} face down: ask for any kind.` : '')}</div>
    <p class="muted">Tokens and cards pass face down. Leave “You get” empty to give something away.</p>
    <div class="row"><button class="btn primary" id="tr-go" ${ok ? '' : 'disabled'}>${G.online && q.bot.human ? 'Send offer' : gift ? 'Give' : 'Propose'}</button><button class="btn" id="tr-cancel">Cancel</button></div>`);
  document.querySelectorAll('#dlgBody [data-k]').forEach(b => b.onclick = () => {
    const T = b.dataset.s === 'give' ? give : get, k = b.dataset.k, d = +b.dataset.d;
    if (k === 'souls') T.souls = Math.max(0, T.souls + d);
    else if (k[0] === 't') T.tokens[k.slice(1)] = Math.max(0, (T.tokens[k.slice(1)] || 0) + d);
    else T.cards[k.slice(1)] = Math.max(0, (T.cards[k.slice(1)] || 0) + d);
    tradeDialog(qid, give, get);
  });
  $('#tr-cancel').onclick = closeDialog;
  $('#tr-go').onclick = async () => {
    closeDialog();
    if (G.online && q.bot.human) return Net.offer(q.id, G1, G2);
    const r = await doCmd('deal', { q: q.id, give: G1, get: G2 }); if (failed(r)) return;
    log(r.accepted ? `${COLOR_NAMES[q.id]} accepts the trade.` : `${COLOR_NAMES[q.id]} declines the trade.`, 'mine');
  };
}
// a trade in words
function dealText(x) {
  const n = {}; for (const c of x.tokens) n[c] = (n[c] || 0) + 1;
  const k = {}; for (const c of x.cards) k[c] = (k[c] || 0) + 1;
  const parts = [...(x.souls ? [`<b>${x.souls} souls</b>`] : []), ...Object.entries(n).map(([c, m]) => `${m} ${COLOR_NAMES[c]} token${m > 1 ? 's' : ''}`), ...Object.entries(k).map(([c, m]) => `${m} ${c}`)];
  return parts.join(', ') || 'nothing';
}

// the duel odds table, from the engine's own numbers (strongerWins), so it always matches the game: weaker ÷ stronger, rounded to 5%
function oddsTable() {

  rows.push(['25% or less', '1–20', 100, 0]);

}

    <p><b>Masks.</b> Nobody can name you while your mask is up, and you must be unmasked to name. Lower it on your turn for +4 souls (your own tokens go back to the bag, +3 each). Remask costs 6. Masked = Lv. 1 of your mask; unmasked = Lv. 2; revealing your true role = Lv. 3.</p>
    <p><b>Trading.</b> On your turn, trade souls, name tokens and event cards with anyone, in any mix, or give them away. Tokens and cards pass face down.</p>
    <p><b>Duels.</b> One per turn. Noblesse Oblige: you may duel someone richer, within 2 souls, whose 3+ tokens you hold, or who gained your token by trade or Seize since your last turn. No duel (or Arrogation) if you received souls in a trade since the end of your last turn. Before the roll, other players may support either side with souls (each side up to half the defender's souls): supporters of the winner get theirs back, supporters of the loser lose theirs to the winner. Stronger side rolls a d20 on the ratio table. Losing masked = lose the mask; unmasked = the victor sends one of your tokens to the bag. With only 2 free players, Noblesse Oblige ends: anyone may duel, both are unmasked and nobody remasks.</p>
    <p><b>Duel odds.</b> Divide the weaker side's strength by the stronger side's and round to the nearest 5%. The stronger side rolls a d20 and wins on the range shown.</p>
    ${oddsTable()}
    <p><b>Naming.</b> You need the most of their tokens (at least 1), or nobody else holds any. Wrong: they enslave or consume you. Right: you choose.</p>
    <p><b>Slaves.</b> Permanently masked, can't name, never hold their master's tokens; their old name dies. Arrogation: duel your master; win = new name and you swap places, lose = they take half your souls.</p>
    <p><b>Consumed.</b> The consumer takes half your souls and your cards. You skip your next turn, then return free with a new name and 2 souls.</p>
    <p class="muted">Full draft: rules-rework.md.</p><p class="muted" style="font-size:.85rem">Icons by Lorc and Delapouite from <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a>, CC BY 3.0. Character art from the Liberated Pixel Cup (Universal LPC Spritesheet Character Generator), by bluecarrot16, JaidynReiman, Eliza Wyatt, Johannes Sjölund, Stephen Challener, Nila122 and others, under OGA-BY 3.0, CC-BY and CC0; full list in art/lpc/CREDITS.md.</p></div><div class="row"><button class="btn" onclick="closeDialog()">Close</button></div>`, true);
}
function rolesDialog() {
  dialog(`<h2>Roles and masks</h2><div class="rules">${ROLES.map((r, i) => `<div class="ability"><h3>${r}</h3><p>Mask covers ${masksFor(i).map(x => ROLES[x]).join(', ')}.</p><p><b>Lv. 1</b> (masked): ${ABIL[i][0]}<br><b>Lv. 2</b> (unmasked): ${ABIL[i][1]}<br><b>Lv. 3</b> (revealed true role): ${ABIL[i][2]}</p></div>`).join('')}</div><div class="row"><button class="btn" onclick="closeDialog()">Close</button></div>`, true);
}

// ---------- online play: the server (rework-play/server.js) runs the game; this page shows your view and sends your actions ----------
const store = { get(k) { try { return JSON.parse(localStorage.getItem('court-rework-' + k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem('court-rework-' + k, JSON.stringify(v)); } catch {} } };
const Net = {
  ws: null, code: null, seat: null, token: null, rid: 0, pending: new Map(), chain: Promise.resolve(), lobby: null, retry: null, wanted: false,
  available() { return location.protocol === 'http:' || location.protocol === 'https:'; },
  nick(v) { if (v !== undefined) store.set('nick', v); return store.get('nick') || ''; },
  linkCode() { return (new URLSearchParams(location.search).get('room') || '').toUpperCase().slice(0, 4); },
  isHost() { return !!(this.lobby && this.lobby.host === this.seat); },
  connect() {
    if (this.ws && this.ws.readyState <= 1) return this.ws.readyState === 1 ? Promise.resolve() : new Promise((res, rej) => { this.ws.addEventListener('open', () => res(), { once: true }); this.ws.addEventListener('error', () => rej(new Error('Could not reach the server.')), { once: true }); });
    return new Promise((res, rej) => {
      const ws = new WebSocket(location.origin.replace(/^http/, 'ws') + '/ws'); this.ws = ws;
      ws.onopen = () => res();
      ws.onerror = () => rej(new Error('Could not reach the server.'));
      ws.onmessage = e => { try { this.onMsg(JSON.parse(e.data)); } catch (err) { console.error(err); } };
      ws.onclose = () => this.onClose(ws);
    });
  },
  raw(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); },
  async create(nick) { this.wanted = true; await this.connect(); this.raw({ t: 'create', nick }); },
  async join(code, nick, token = null, auto = false) { this.auto = auto ? code : null; this.wanted = true; await this.connect(); const s = store.get('session') || {}; this.raw({ t: 'join', code, nick, token: token || (s.code === code ? s.token : null) }); },
  send(cmd, a) { return new Promise(res => { const rid = ++this.rid; this.pending.set(rid, res); this.raw({ t: 'cmd', rid, cmd, a }); }); },
  resolve(rid, res) { const f = this.pending.get(rid); if (f) { this.pending.delete(rid); f(res || { ok: false }); } },
  offer(to, give, get) { this.raw({ t: 'offer', to, give, get }); log(`Offer sent to ${COLOR_NAMES[to]}.`, 'mine'); },
  restart() { this.raw({ t: 'restart' }); },
  leave() { this.wanted = false; this.raw({ t: 'leave' }); store.set('session', null); if (this.ws) this.ws.close(); this.ws = null; this.code = null; this.lobby = null; },
  onClose(ws) {
    if (ws !== this.ws || !this.wanted) return;
    this.ws = null;
    if (G && G.online) log('Connection lost — reconnecting…', 'big');
    clearTimeout(this.retry);
    this.retry = setTimeout(() => { const s = store.get('session'); if (s && this.wanted) this.join(s.code, this.nick(), s.token).catch(() => this.onClose(null)); }, 2000);
  },
  onMsg(m) {
    switch (m.t) {
      case 'welcome': this.auto = null; this.code = m.code; this.seat = m.seat; this.token = m.token; store.set('session', { code: m.code, token: m.token }); history.replaceState(null, '', '?room=' + m.code); break;
      case 'lobby': this.lobby = m; if (m.phase === 'lobby') showRoom(); else if (G && G.online) { G.seats = m.seats; if (!G.busy) renderTable(); } break;
      case 'update': this.chain = this.chain.then(() => applyUpdate(m)).catch(err => console.error(err)); break;
      case 'offer': offerToast(m); break;
      case 'backAsk': backingToast(m); break;
      case 'backGone': { const el = document.querySelector(`.toast[data-back="${m.id}"]`); if (el) { el._stop && el._stop(); el.remove(); } break; }
      case 'question': questionToast(m); break;
      case 'questionGone': { const el = document.querySelector(`.toast[data-question="${m.id}"]`); if (el) { el._stop && el._stop(); el.remove(); } break; }
      case 'offerGone': { const el = document.querySelector(`.toast[data-offer="${m.id}"]`); if (el) el.remove(); break; }
      case 'note': if (G) log(m.text, 'mine'); break;
      case 'chat': if (G) { G.log.push({ chat: m.from, s: m.text, r: 0 }); renderLog(); if (m.from !== G.me && $('#board').dataset.tab !== 'record') $('#tabs [data-tab="record"]').classList.add('ping'); } break;
      case 'error': {
        if (m.fatal) { store.set('session', null); this.wanted = false; }
        if (this.auto && m.fatal) { if (Net.linkCode() === this.auto) history.replaceState(null, '', location.pathname); this.auto = null; if (!$('#home').hidden) showHome(); break; }
        const box = !$('#home').hidden && ($('#jn-err') || $('#on-err'));
        if (box) box.textContent = m.text;
        else if (m.fatal && !(G && G.online)) { $('#room').dataset.code = ''; showHome(); $('#on-err').textContent = m.text; }
        else if (G) log(m.text, 'big');
        break;
      }
    }
  },
};
// ---------- waiting room: after creating or joining a room, until the host starts ----------
// Built once per room; each lobby message from the server refreshes the seats and the host's settings (your name field is left alone while you type).
function showRoom() {
  const L = Net.lobby, el = $('#room'), link = `${location.origin}${location.pathname}?room=${L.code}`;
  closeDialog();
  $('#app').classList.add('front'); $('#tabs').hidden = true; el.hidden = false; $('#home').hidden = true; $('#board').hidden = true; $('#leaveBtn').hidden = true; $('#sub').textContent = '';
  if (el.dataset.code !== L.code) {
    el.dataset.code = L.code;
    el.innerHTML = `
      <div class="room-head">
        <span class="label">Waiting room · room code</span>
        <div class="roomcode">${L.code}</div>
        <div class="row center"><button class="btn small" id="rm-copy">Copy invite link</button><span class="muted" id="rm-copied"></span></div>
      </div>
      <div class="room-grid">
        <section class="home-card"><h2>Players</h2><div class="room-seats" id="rm-seats"></div></section>
        <section class="home-card"><h2>Settings</h2>
          <div class="row"><span class="label" style="width:100px">Your name</span><input type="text" id="rm-nick" maxlength="16" autocomplete="off"></div>
          <div id="rm-host"></div>
          <div class="row"><span class="label" style="width:100px">Animation</span><select id="lb-s">${[['600', 'normal'], ['1200', 'slow'], ['150', 'fast'], ['0', 'instant']].map(([v, t]) => `<option value="${v}" ${String(store.get('speed') ?? 600) === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        </section>
      </div>
      <div class="row center"><span id="rm-go"></span><button class="btn" id="lb-leave">Leave</button></div>`;
    $('#rm-copy').onclick = () => { const done = t => { $('#rm-copied').textContent = t; }; (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => done('Copied.'), () => done(link)); };
    $('#lb-s').onchange = () => store.set('speed', +$('#lb-s').value);
    const nick = $('#rm-nick');
    nick.onchange = () => { const v = nick.value.replace(/[<>&"]/g, '').trim().slice(0, 16) || 'Player'; nick.value = v; Net.nick(v); Net.raw({ t: 'nick', nick: v }); };
    nick.onkeydown = e => { if (e.key === 'Enter') nick.blur(); };
    $('#lb-leave').onclick = () => { Net.leave(); history.replaceState(null, '', location.pathname); if (G && G.online) G = null; el.dataset.code = ''; showHome(); };
  }
  const host = Net.isHost(), mine = L.seats[Net.seat];
  if (document.activeElement !== $('#rm-nick') && mine && !mine.bot) $('#rm-nick').value = mine.nick;
  $('#rm-seats').innerHTML = Array.from({ length: L.n }, (_, i) => { const s = L.seats[i], person = s && !s.bot;
    return `<div class="room-seat" style="--pc:${pc(i)}">${who(i, COLOR_NAMES[i])}<span>${person ? esc(s.nick) + (i === Net.seat ? ' (you)' : '') : '<span class="muted">bot</span>'}</span>${person ? `<span class="muted">${[i === L.host ? 'host' : '', s.connected ? '' : 'away'].filter(Boolean).join(' · ')}</span>` : ''}</div>`; }).join('');
  $('#rm-host').innerHTML = host
    ? `<div class="row"><span class="label" style="width:100px">Seats</span><select id="lb-n">${[3, 4, 5, 6].map(n => `<option ${n === L.n ? 'selected' : ''} ${n < L.humans ? 'disabled' : ''}>${n}</option>`).join('')}</select></div>
       <div class="row"><span class="label" style="width:100px">Bots</span><select id="lb-b">${['mix', 'aggressor', 'balanced', 'turtle'].map(t => `<option ${t === L.bots ? 'selected' : ''}>${t}</option>`).join('')}</select></div>`
    : `<p class="muted">${L.n} seats · ${L.bots} bots. The host picks these.</p>`;
  if (host) $('#lb-n').onchange = $('#lb-b').onchange = () => Net.raw({ t: 'config', n: +$('#lb-n').value, bots: $('#lb-b').value });
  $('#rm-go').innerHTML = host ? '<button class="btn primary" id="lb-go">Start the game</button>' : '<span class="muted">Waiting for the host to start.</span>';
  if (host) $('#lb-go').onclick = () => Net.raw({ t: 'start' });
}
// online: a panel that doesn't block your screen; the server rolls without you when its timer runs out
function backingToast(m) {
  const w = m.req.who[0]; if (!w) return;
  const el = document.createElement('div'); el.className = 'toast backing'; el.dataset.back = m.id;
  el.innerHTML = backingHTML(m.req, w);
  const end = Date.now() + m.secs * 1000, timer = el.querySelector('.bk-timer');
  const tick = setInterval(() => { const left = Math.max(0, Math.ceil((end - Date.now()) / 1000)); timer.textContent = `${left}s`; if (!left) clearInterval(tick); }, 250);
  wireBacking(el, m.req, w, ans => { clearInterval(tick); el.remove(); Net.raw({ t: 'backReply', id: m.id, side: ans ? ans.side : null, amount: ans ? ans.amount : 0 }); });
  el._stop = () => clearInterval(tick);
  $('#toasts').appendChild(el);
}
// an Archduke's free question to you: answer yes or no (truthfully, by the rules); only they see the answer
function questionToast(m) {
  const el = document.createElement('div'); el.className = 'toast'; el.dataset.question = m.id;
  el.innerHTML = `<div>${who(m.from)} (Archduke) asks you: <b>"${esc(m.text)}"</b></div><p class="muted" style="font-size:.85rem;margin:0">Answer truthfully. Only they see your answer.</p>
    <div class="row"><button class="btn primary small" data-y="1">Yes</button><button class="btn small" data-y="0">No</button><span class="muted q-timer"></span></div>`;
  const end = Date.now() + m.secs * 1000, timer = el.querySelector('.q-timer');
  const tick = setInterval(() => { const left = Math.max(0, Math.ceil((end - Date.now()) / 1000)); timer.textContent = `${left}s`; if (!left) clearInterval(tick); }, 250);
  el._stop = () => clearInterval(tick);
  el.querySelectorAll('[data-y]').forEach(b => b.onclick = () => { clearInterval(tick); el.remove(); Net.raw({ t: 'answer', id: m.id, yes: b.dataset.y === '1' }); });
  $('#toasts').appendChild(el);
}
// a trade offer from another player: accept or decline without blocking your screen
function offerToast(m) {
  const el = document.createElement('div'); el.className = 'toast'; el.dataset.offer = m.id;
  const gift = !m.get.souls && !m.get.tokens.length && !m.get.cards.length;
  el.innerHTML = `<div>${who(m.from)} ${gift ? `wants to give you ${dealText(m.give)}` : `offers ${dealText(m.give)} for ${dealText(m.get)} of yours`}.</div>
    <div class="row"><button class="btn primary small" data-y="1">Accept</button><button class="btn small" data-y="0">Decline</button></div>`;
  el.querySelectorAll('[data-y]').forEach(b => b.onclick = () => { Net.raw({ t: 'offerReply', id: m.id, yes: b.dataset.y === '1' }); el.remove(); });
  $('#toasts').appendChild(el);
}
// one update from the server: replay its events over the table, then show the new state
async function applyUpdate(m) {
  const fresh = !G || !G.online || G.gameId !== m.gameId;
  if (fresh) {
    if ($('#dlg').open) closeDialog();
    G = { online: true, gameId: m.gameId, q: [], cur: null, busy: false, ctx: {}, looks: m.looks, me: m.seat, idx: m.idx, over: false, myTurn: false, log: [], seats: m.seats, opts: { speed: store.get('speed') ?? 600, showTypes: false, xray: false } };
    showBoard();   // an online game starts (or is rejoined): leave the start page
    $('#chatForm').hidden = false;
  }
  G.seats = m.seats;
  const wasMine = G.myTurn, g = hydrate(m.state);
  g.log = m.log.slice(); G.g = g; G.idx = m.idx; G.q = fresh ? [] : m.events; G.myTurn = false;
  if (fresh) { const p = ME(); log(`Room ${Net.code}: you are ${COLOR_NAMES[G.me]}. Your secret name is ${p.name.join('-')}: ${ROLES[p.role]}.`, 'mine'); }
  await playQueue();
  G.myTurn = m.myTurn; G.over = m.over;
  render();
  if (m.rid) Net.resolve(m.rid, m.res);
  const p = ME();
  if (G.myTurn && !wasMine) log(`Your turn: +${G.g.C.INCOME} souls${p.status !== 'free' && p.master !== null ? `, tribute paid to ${COLOR_NAMES[p.master]}` : ''}.`, 'mine');
  if (p.needMask && !$('#dlg').open && !G.maskAsked) {
    G.maskAsked = true;
    chooseMask(G.g.round > 1 ? `You return as ${p.name.join('-')} (${ROLES[p.role]}): choose your mask` : 'Choose your starting mask', mk => Net.send('chooseMask', { m: mk }).then(() => { G.maskAsked = false; }));
  }
  if (m.over && !G.shownWin) { G.shownWin = true; const w = m.winner !== null ? G.g.P[m.winner] : null; log(w ? (w.id === G.me ? 'You win! Everyone else serves you.' : `${COLOR_NAMES[w.id]} wins the game.`) : 'The game ended.', 'big'); winDialog(w); }
}
$('#chatForm').onsubmit = e => { e.preventDefault(); const t = $('#chatIn').value.trim(); if (t) Net.raw({ t: 'chat', text: t }); $('#chatIn').value = ''; };

$('#rulesBtn').onclick = rulesDialog;
$('#abilBtn').onclick = rolesDialog;
$('#leaveBtn').onclick = leaveRoom;
// rejoin a game in progress after a reload
// open on the start page; if this browser was in an online room, rejoin it (its waiting room or game then shows instead)
(() => { showHome(); const s = store.get('session'); if (Net.available() && s && s.code) Net.join(s.code, Net.nick() || 'Player', s.token, true).catch(() => {}); })();
</script>
