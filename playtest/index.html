<style>
/* Layout: one column "table" — a handoff screen between turns, a private turn view, and a public ledger of the court underneath.
   Theme matches the rulebook PDF: parchment, maroon small-caps headings, gold rules, Palatino text, green callout boxes. */
:root{
  --bg:#ede4cc; --surface:#f6f0e0; --sunk:#e4d9bc; --ink:#2b2118; --muted:#6c5e4b; --line:#d3c4a2;
  --accent:#6e1c12; --on-accent:#f8f1e2; --gold:#b8954f; --rule:#c8a96a; --danger:#9e2b1c; --ok:#3d6b2e;
  --callout:#dfe3c4; --callout-edge:#2b2118; --example:#f6f0e0;
  --c0:#b0281f; --c1:#2350a8; --c2:#1f7646; --c3:#a5600a; --c4:#6c3fa3; --c5:#11777a;
  --font-display:"Palatino Linotype", "Book Antiqua", Palatino, "EB Garamond", Georgia, serif;
  --font-body:"Palatino Linotype", "Book Antiqua", Palatino, "EB Garamond", Georgia, serif;
  --font-head:"Fira Sans", "Segoe UI", system-ui, sans-serif;
  --font-data:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1712; --surface:#28201a; --sunk:#15100c; --ink:#efe6d3; --muted:#b0a28b; --line:#45382b;
    --accent:#de8f7c; --on-accent:#1d0f0b; --gold:#d2ad66; --rule:#8f7442; --danger:#ec7a66; --ok:#8cc27a;
    --callout:#2d3220; --callout-edge:#cbbd9f; --example:#241c16;
    --c0:#f0635a; --c1:#76a2ff; --c2:#4fcf8c; --c3:#f2a640; --c4:#bb92f2; --c5:#43c9c9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1712; --surface:#28201a; --sunk:#15100c; --ink:#efe6d3; --muted:#b0a28b; --line:#45382b;
  --accent:#de8f7c; --on-accent:#1d0f0b; --gold:#d2ad66; --rule:#8f7442; --danger:#ec7a66; --ok:#8cc27a;
  --callout:#2d3220; --callout-edge:#cbbd9f; --example:#241c16;
  --c0:#f0635a; --c1:#76a2ff; --c2:#4fcf8c; --c3:#f2a640; --c4:#bb92f2; --c5:#43c9c9;
  color-scheme:dark;
}

<div class="rules">
<p class="rulebook-link"><a href="rulebook.pdf" target="_blank" rel="noopener">Full rulebook (PDF)</a>: the complete rules with examples. This is the quick reference.</p>
<h3>Setup</h3>
<p>Each player secretly picks a combination of 4 name tokens in their color, each with 1 to 4 dots (repeats allowed). The 35 combinations each map to a demon name, 7 per role. Sum of dots mod 5 is your role. Players may pick the same combination. Name tokens go in the bag, event cards form a face-down deck. Everyone starts with 2 souls. A die roll picks the first player; play goes counterclockwise.</p>
<h3>Goal</h3>
<p>Be the last player standing: every other player is devoured or is your thrall.</p>
<h3>Name tokens</h3>
<p>Your tokens sit in front of you dot side down. How many tokens of each color every player holds is public. When a player is devoured, all tokens of their color leave the game.</p>
<p><b>Blank tokens:</b> each color has 4 numbered tokens and 4 blanks. Only the holder knows a token is blank. Blanks count as tokens for everything (naming, trading, Seize, devouring, Welfare) but say nothing about a name.</p>
<p><b>Holding cap:</b> while you hold 6 or more name tokens (each thrall you have adds 6), you can't gain any more: no buying, drawing, Scrying, trading for tokens, Seize steals, Restoration, or tokens given to you after a capture. A trade can't put you over the cap either. Only binding and devouring can take you over it; you keep what you hold, but can't gain more until you're back under. On your turn you may put any of your tokens back into the bag, face down, and get 1 soul for each, as many as you like.</p>
<h3>Naming</h3>
<p>At any time, you may name a player if you hold at least 1 of their tokens and no other player holds more (the target's own tokens don't count, tokens held by thralls do; ties may all try). If no other player holds any of their tokens, anyone may name them. Announce bind or devour first. Right: you do it. Wrong: they choose to bind or devour you. A Prince can only bind; a Marquis can only devour and cannot be bound. When a Prince names a Marquis correctly or decides a Marquis's fate, the Prince devours them. No hinting at your tokens.</p>
<p><b>Bind:</b> they stay in under you; take all their event cards and souls, and choose 1 of their name tokens (face down, by color). You may devour your thrall on any of your turns. <b>Devour:</b> they're out; take all their event cards and souls, half their name tokens (rounded up; you choose them by color, face down), and 4 souls from the bank (not when devouring your own thrall). The rest of their tokens go back into the bag. After binding or devouring, before looking at the tokens you took, you may give any of them away, face down and free, to players who aren't thralls.</p>
<h3>Thralls</h3>
<p>Thralls take turns, but each turn they produce 2 souls for their binder, and any soul a thrall gets goes straight to their binder. Thralls can't name (except by Arrogation) and can't be stolen. If a binder is devoured or bound, their thralls go to whoever did it.</p>
<h3>Turns</h3>
<p>At the start of each of your turns you gain 2 souls; a thrall instead produces 2 souls, which go to their binder. You may make only 1 name token purchase per turn: 2 souls for a random token, or 3 souls to draw 2 and keep 1, choosing by color only; the other goes back into the bag unseen. An event card costs 1 soul. The event deck reshuffles when empty.</p>
<h3>Trading</h3>
<p>On your turn, you may trade souls, event cards, and name tokens with any other player. For each name token traded, both the giver and the receiver pay 3 souls to the bank. Name tokens are passed face down, so only the two traders know their dots; the table sees only their colors. Event cards are passed face down. Promises about future trades are not binding unless made with a Pact. Thralls can't trade, and nobody can trade with a thrall.</p>
<h3>Roles</h3>
<p>If a Prince names a Marquis correctly, or decides a Marquis's fate (for example, the Marquis names the Prince wrongly), the Prince devours the Marquis.</p>
<p><b>Archduke:</b> compel one truthful yes/no answer, once per player, including thralls and devoured players. <b>Duke:</b> while holding an Arrogation card, can use the Archduke's question on up to half the other starting players (rounded down) over the whole game. <b>Prince:</b> cannot devour, except a Marquis it names correctly or whose fate it decides; buys tokens from own thralls for 2 souls each (paid to the bank). <b>Marquis:</b> cannot bind or be bound; once named correctly, anyone except a Prince may devour them later for 4 souls, cards, souls, tokens and the 4-soul devour bonus going to the original namer (or whoever devoured that namer). <b>Earl:</b> one free event card on each of their turns.</p>
<h3>Event cards</h3>
<p><b>Seize:</b> discard 2 to steal an event card; discard 4 to steal a random face-down token of a chosen color. <b>Collect:</b> trade for 2 souls. <b>Restoration:</b> choose a player holding tokens of your color; they give you 1 token of your color of their choice, face down. <b>Scrying:</b> either draw 2 tokens without looking at their dots, keep 1 by color, and put the other back unseen (the same as the 3-soul purchase, for free; counts as your 1 token purchase that turn, and not while you are at your holding cap), or discard 2 Scrying cards to look at the top 4 event cards: any that act when drawn take effect at once and don't count; keep 2 of the others and discard the rest. <b>Ward:</b> when you would be bound or devoured because someone named you correctly, paid to devour you as a marked Marquis, or because you broke a Pact, you may discard 3 Wards: it waits until the end of your next turn, when you may discard 3 more to delay it again. Meanwhile you play normally, but no one else may name you or pay to devour you. If the player claiming you is bound or devoured first, the claim passes to whoever did it (they choose bind or devour). If you bind or devour them yourself, the claim ends, and if you had been named you are reborn. A broken Pact with yourself has no claimant; Ward only delays it. Not against your own wrong guess, and it doesn't stop a Marquis being marked. <b>Arrogation:</b> a Duke who draws it may keep it (while holding it, they have the Archduke's question with the Duke's limit). Otherwise, if any thrall could use it, you must give it to a thrall of your choice, who may try to name their binder (no token requirement): success swaps them and moves the other thralls; failure gives the binder all the thrall's tokens and bars further rebellion against that binder. Otherwise put it back anywhere in the deck or discard it. It can be traded or stolen; anyone but a Duke who ends up holding one gets no effect from it. <b>Meta:</b> on draw, immediately verbally/physically assault a player of your choice. <b>Rebirth:</b> a thrall who becomes free secretly chooses any new name except their old one, and their role follows the new name. Every one of their old numbered tokens, in hands and in the bag, is replaced one for one by a random piece of the new name; blanks stay blank. <b>Pact:</b> a deal with a player (they must accept it; whoever breaks it is bound or devoured, as the other party chooses) or with yourself (every other player must approve it, and the terms say who will receive your souls, cards, tokens and thralls if you break it). Rejected: the card comes back. A Pact is kept or broken when every player but one agrees (never fewer than two), and for a two-player deal, agrees on who broke it. Break a Pact with yourself and you are devoured, and everything goes where the terms said. Thralls can't be in Pacts (they still vote); a Pact is void when a party is bound or devoured. Votes are cast on the Pacts tab. <b>Welfare:</b> on draw, the player with the lowest net worth (souls + event cards + 2 × tokens) who isn't a thrall takes 1 soul from everyone with souls; ties split, any odd soul goes to the second-lowest.</p>

/* ---------- helpers ---------- */

const keyOf = c => [...String(c)].sort().join("");

const rand = n => Math.floor(Math.random()*n);

let S = null;          // game state

const P = i => S.players[i];

const free = () => S.players.filter(p => p.status === "alive");
const slavesOf = p => S.players.filter(x => x.status==="slave" && x.master===p.id);
const countColor = (p, color) => p.tokens.filter(t => t.owner===color).length;

const countCard = (p, c) => p.events.filter(x => x===c).length;

/* ---------- modal ---------- */
function ask({title, body="", options=[], row=false, to}){
  return new Promise(res=>{
    const m = $("#modal");
    // The corner X (and Esc) only appears when the pop-up already has a way out, and does exactly what that button does.
    const dismiss = options.find(o => !o.disabled && !o.read && (o.kind==="quiet" || /^(Cancel|Close|OK|Decline|Later|Don't|Keep playing)\b/.test(o.label)));
    m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      ${dismiss?`<button class="x-btn" data-x aria-label="Close" title="Close (Esc)">&times;</button>`:""}
      <h2>${title}</h2>${body?`<div class="sheet-body">${body}</div>`:""}
      <p class="err" hidden></p>
      ${options.length?`<div class="sheet-actions${row?" row":""}">${options.map((o,i)=>`<button class="btn ${o.kind||""}" data-i="${i}" ${o.disabled?"disabled":""}>${o.label}${o.sub?`<span class="sub">${o.sub}</span>`:""}</button>`).join("")}</div>`:""}
    </div>`;
    m.hidden = false;
    const done = v => { m.hidden = true; m.innerHTML = ""; res(v); };
    m.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
      const o = options[+b.dataset.i];
      if (o.read){ const r = o.read(m); if (r && r.error){ const e=m.querySelector(".err"); e.textContent=r.error; e.hidden=false; return; } done(r.value); return; }
      done(o.value);
    });
    m.querySelectorAll("[data-v]").forEach(b => b.onclick = () => done(b.dataset.v));
    if (dismiss){
      m.querySelector("[data-x]").onclick = () => done(dismiss.value);
      m.onkeydown = e => { if (e.key==="Escape"){ e.preventDefault(); done(dismiss.value); } };
    } else m.onkeydown = null;
    const first = m.querySelector(".sheet-actions button:not(:disabled), [data-v]:not([disabled])") || m.querySelector("button:not(:disabled)"); if (first) first.focus();
  });
}

/* ---------- setup ---------- */
function newGame(names){
  S = {
    phase:"pick", pickIdx:0, pickShown:false, draft:Array(CFG.TOKENS).fill(1),
    players: names.map((n,i)=>({id:i, name:n, color:i, combo:null, souls:2, events:[], tokens:[], status:"alive", master:null,
      archUses:0, asked:[], revealed:false, rebelBlocked:[], markedBy:null})),
    bag:[], deck:[], discard:[], round:0, queue:[], current:null, first:null, spent:0, earlUsed:false,
    log:[], contracts:[], view:"handoff", interrupts:[], claims:[], claimSeq:0, turnSerial:0, winner:null, tokSeq:0, contractSeq:0, capLifted:false
  };
}
function startGame(){
  S.players.forEach(p => [...p.combo].forEach(d => S.bag.push({id:S.tokSeq++, owner:p.id, dots:+d})));
  S.players.forEach(p => { for (let i=0;i<FAKES;i++) S.bag.push({id:S.tokSeq++, owner:p.id, dots:0}); });   // blank tokens (sim variant)
  shuffle(S.bag);
  for (const [t,n] of Object.entries(DECK_COUNTS)) for (let i=0;i<n;i++) S.deck.push(t);
  shuffle(S.deck);
  S.first = rand(S.players.length);
  S.phase = "play";
  log(`Die roll: ${P(S.first).name} goes first. Play goes counterclockwise.`);
  newRound();
}
function seatOrderFrom(start){
  const n=S.players.length, out=[];
  for (let k=0;k<n;k++) out.push((start - k + n) % n);   // counterclockwise = descending seat index
  return out;
}
function newRound(){
  S.round++;
  log(`Round ${S.round} begins.`);
  S.queue = seatOrderFrom(S.first).filter(i => P(i).status!=="dead");
  nextTurn();
}
function nextTurn(){
  if (checkWin()) return;
  S.queue = S.queue.filter(i => P(i).status!=="dead");
  if (!S.queue.length){ newRound(); return; }
  S.current = S.queue.shift(); S.spent = 0; S.earlUsed = false; S.tokenBought = false; S.view = "handoff";
  S.turnSerial = (S.turnSerial||0) + 1;   // Ward claims wait until the end of the target's *next* turn
  const cp = P(S.current);
  if (cp.status==="slave"){ P(cp.master).souls+=SLAVE_INCOME; log(`${cp.name}'s turn: their ${SLAVE_INCOME} soul${SLAVE_INCOME===1?"":"s"} go${SLAVE_INCOME===1?"es":""} to ${P(cp.master).name}.`); }

}
function checkWin(){
  const f = free();
  if (S.phase==="play" && f.length===1){ S.winner=f[0].id; S.phase="over"; log(`${f[0].name} rules the court.`); return true; }
  return false;
}

/* ---------- core mechanics ---------- */
function canSpend(p,n){ return p.souls>=n && S.spent+n<=SPEND_CAP; }
function spend(p,n){ p.souls-=n; S.spent+=n; }
function takeRandom(arr){ return arr.splice(rand(arr.length),1)[0]; }

const nobodyHolds = t => !S.players.some(o => o.id!==t.id && o.status!=="dead" && countElig(o,t.id)>0);
function eligibility(a, t){
  if (a.status!=="alive") return "Thralls cannot name";
  if (t.id===a.id) return "That's you";
  if (t.status==="dead") return "Devoured";
  if (t.status==="slave") return "Thralls can't be named or stolen";
  if (activeClaim(t)) return "Warded: a claim on them is waiting";
  if (t.markedBy!=null) return "Already named (marked Marquis)";
  if (nobodyHolds(t)) return null;   // anti-turtling: if no other player holds any of their tokens, anyone may name them
  const mine = countElig(a, t.id);
  if (mine<1) return `You hold none of ${t.name}'s tokens`;
  const rival = S.players.find(o => o.id!==a.id && o.id!==t.id && o.status!=="dead" && countElig(o,t.id)>mine);
  if (rival) return `${rival.name} holds more of ${t.name}'s tokens`;
  return null;
}

async function enslave(master, s){
  s.status="slave"; s.master=master.id;
  const ec=s.events.length;
  master.events.push(...s.events.splice(0));
  const sv=s.souls; master.souls+=sv; s.souls=0;
  if (sv) log(`${master.name} took ${s.name}'s ${sv} soul${sv===1?"":"s"}.`);
  let took="no name token (they had none)";
  if (s.tokens.length && CAP_SPOILS && atCap(master)) took="no name token (at their holding cap)";
  else if (s.tokens.length){
    const idx = await ask({title:`${esc(master.name)}: take 1 of ${esc(s.name)}'s name tokens`, body:`<p class="muted">Tokens are face down; you see only their color. You also take all ${ec} of their event card${ec===1?"":"s"}.</p><div class="toks" style="margin-top:10px">${s.tokens.map((t,i)=>`<button class="btn small" data-v="${i}" aria-label="${esc(P(t.owner).name)} token">${tokHTML(0,P(t.owner).color,true)}</button>`).join("")}</div>`});
    const t=s.tokens.splice(+idx,1)[0]; master.tokens.push(t); await giftTokens(master, [t], s, false); took=`1 of their name tokens (${P(t.owner).name}'s color)`;
  }
  S.players.forEach(x=>{ if (x.status==="slave" && x.master===s.id) x.master=master.id; });
  log(`${master.name} bound ${s.name}, taking all ${ec} event card${ec===1?"":"s"} and ${took}.`);
  voidPactsOf(s);
  await announce(`${esc(s.name)} is bound`, `${captureWhy?esc(captureWhy)+". ":""}${esc(master.name)} bound ${esc(s.name)}${s.revealed?` (${NAME_OF[s.combo]}, the ${baseRole(s)})`:""}, who is now their thrall.`);
  await claimsOnCapture(master, s);
}
// Thralls can't be in Pacts, and the devoured are out: their open Pacts are void. A Pact card held by a proposal
// goes back to the proposer if they are still free, otherwise to the discard pile.
function voidPactsOf(x){
  S.contracts.forEach(c=>{
    if ((c.status!=="active" && c.status!=="pending") || (c.a!==x.id && c.b!==x.id)) return;
    if (c.status==="pending"){ const a=P(c.a); if (a.status==="alive" && a.id!==x.id) a.events.push("Pact"); else S.discard.push("Pact"); }
    c.status="void";
    log(`The Pact "${c.terms}" is void: ${x.name} ${x.status==="dead"?"was devoured":"is a thrall"}.`);
  });
}
async function consume(killer, victim, receiver=killer){
  if (victim.status!=="slave" || victim.master!==killer.id){
    killer.devours = (killer.devours||0) + 1;   // capture tally (Welfare "captures" variant)
    if (DEVOUR_SLOTS) receiver.capBonus = (receiver.capBonus||0) + DEVOUR_SLOTS;
  }
  const wasSlave = victim.status==="slave";   // no consume bonus for consuming a slave (no enslave-then-consume double dip)
  victim.status="dead"; victim.master=null; victim.revealed=true;
  shuffle(victim.tokens);
  const ec=victim.events.length, tc0=CONSUME_TOKENS==='all' ? victim.tokens.length : Math.ceil(victim.tokens.length/2);
  const tc = CAP_SPOILS ? Math.min(tc0, capRoom(receiver)) : tc0;
  receiver.events.push(...victim.events.splice(0));
  const sv=victim.souls; receiver.souls+=sv; victim.souls=0;
  if (sv) log(`${receiver.name} took ${victim.name}'s ${sv} soul${sv===1?"":"s"}.`);
  // the bonus goes to whoever receives the spoils: normally the devourer; for a paid Marquis devour, the original namer (not the payer) original namer
  // (sim variant MARQUIS_NO_BONUS: a Marquis earns no devour bonus)
  if (CONSUME_BONUS && !wasSlave && !(CFG.MARQUIS_NO_BONUS && baseRole(killer)==="Marquis")){ receiver.souls+=CONSUME_BONUS; log(`${receiver.name} gained ${CONSUME_BONUS} souls for the devour.`); }
  // the receiver chooses which tokens to take, by color, face down
  let keep = victim.tokens.map((_,i)=>i).slice(0,tc);
  if (tc>0 && tc<victim.tokens.length){
    keep = await ask({title:`${esc(receiver.name)}: Keep ${tc} of ${esc(victim.name)}'s name tokens`,
      body:`<p class="muted">They're face down: you choose by color only. The rest go back into the bag. Tokens of ${esc(victim.name)}'s own color leave the game.</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${victim.tokens.map((t,i)=>`<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" data-k="${i}"> ${tokHTML(0,P(t.owner).color,true)} ${esc(P(t.owner).name)}'s token</label>`).join("")}</div>`,
      options:[{label:"Take these", kind:"primary", read:m=>{ const sel=[...m.querySelectorAll("input[data-k]:checked")].map(x=>+x.dataset.k); return sel.length===tc?{value:sel}:{error:`Choose exactly ${tc}.`}; }}]});
  }
  const taken = victim.tokens.filter((_,i)=>keep.includes(i));
  receiver.tokens.push(...taken);
  await giftTokens(receiver, taken, victim, true);
  const rest = victim.tokens.filter((_,i)=>!keep.includes(i)); victim.tokens = [];
  const tr=rest.length;
  S.bag.push(...rest);
  if (tr) log(`The other ${tr} of ${victim.name}'s name token${tr===1?"":"s"} went back into the bag.`);
  S.players.forEach(x=>{ if (x.status==="slave" && x.master===victim.id) x.master=receiver.id; });
  // tokens of the consumed player's color leave the game
  let removed=0;
  S.players.forEach(x=>{ const before=x.tokens.length; x.tokens=x.tokens.filter(t=>t.owner!==victim.id); removed+=before-x.tokens.length; });
  const bb=S.bag.length; S.bag=S.bag.filter(t=>t.owner!==victim.id); removed+=bb-S.bag.length;
  S.players.forEach(x=>{ if (x.markedBy===victim.id) x.markedBy=killer.id; });
  voidPactsOf(victim);
  S.queue = S.queue.filter(i=>i!==victim.id);
  log(`${killer.name} devoured ${victim.name} (${NAME_OF[victim.combo]}, ${baseRole(victim)}). ${receiver.name} took ${ec} event card${ec===1?"":"s"} and ${tc} token${tc===1?"":"s"}; ${removed} ${victim.name} token${removed===1?"":"s"} left the game.`);
  await announce(`${esc(victim.name)} is devoured`, `${captureWhy?esc(captureWhy)+". ":""}${esc(killer.name)} devoured ${esc(victim.name)}, who was ${NAME_OF[victim.combo]}, the ${baseRole(victim)}.`);
  await claimsOnCapture(killer, victim);
}
// After binding or devouring, before looking at the name tokens you took, you may give any of them away, face down,
// to players who aren't thralls. No trade fee: you never saw them. (On a devour the victim's own color is left out:
// those tokens leave the game anyway.)
async function giftTokens(giver, toks, victim, devour){
  const offer = toks.filter(t=>!(devour && t.owner===victim.id));
  const recips = S.players.filter(x=>x.status==="alive" && x.id!==giver.id && x.id!==victim.id && !atCap(x));   // not to anyone at their holding cap
  if (!offer.length || !recips.length || giver.status==="dead") return;
  const res = await ask({title:`${esc(giver.name)}: give away any tokens you just took?`,
    body:`<p class="muted">Before looking at them, you may give any of these face-down tokens to players who aren't thralls. No trade fee is paid.</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${offer.map((t,i)=>`<label style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${tokHTML(0,P(t.owner).color,true)} ${esc(P(t.owner).name)}'s token
        <select data-g="${i}" style="width:auto"><option value="">Keep</option>${recips.map(r=>`<option value="${r.id}">Give to ${esc(r.name)}</option>`).join("")}</select></label>`).join("")}</div>`,
    options:[{label:"Keep them all", value:[], kind:"primary"},
             {label:"Give as chosen", read:m=>({value:[...m.querySelectorAll("select[data-g]")].filter(x=>x.value!=="").map(x=>[+x.dataset.g, +x.value])})}]});
  for (const [i, rid] of (res||[])){
    const t = offer[i], r = P(rid);
    if (!t || !r || r.status!=="alive") continue;
    if (atCap(r)){ log(`${r.name} is at their holding cap, so ${giver.name} kept that token.`); continue; }
    giver.tokens.splice(giver.tokens.indexOf(t),1); r.tokens.push(t);
    log(`${giver.name} gave 1 ${P(t.owner).name} token, unseen, to ${r.name}.`);
  }
}
async function applyAction(w, l, act){ if (act==="enslave") await enslave(w,l); else await consume(w,l); }

async function chooseFate(chooser, victim, title){
  // A Prince who decides a Marquis's fate can't enslave them, so the Prince consumes them.
  if (baseRole(chooser)==="Prince" && baseRole(victim)==="Marquis"){
    log(`${victim.name} is a Marquis and can't be bound, so ${chooser.name} (Prince) devours them.`);
    await info("The Prince devours the Marquis", `${esc(victim.name)} is a Marquis and can't be bound, so ${esc(chooser.name)} devours them.`);
    await consume(chooser, victim);
    return;
  }
  const canEnslave = baseRole(chooser)!=="Marquis" && baseRole(victim)!=="Marquis";
  const canConsume = baseRole(chooser)!=="Prince";
  const opts=[];
  if (canEnslave) opts.push({label:`Bind ${esc(victim.name)}`, value:"enslave"});
  if (canConsume) opts.push({label:`Devour ${esc(victim.name)}`, value:"consume", kind:"primary"});
  const v = await ask({title, body:`<p>${chip(chooser)} decides what happens to ${chip(victim)}.</p>`, options:opts});
  await applyAction(chooser, victim, v);
}

async function doNaming(a, {onTurn}){
  const targets = S.players.filter(t=>t.id!==a.id && t.status==="alive");
  if (!targets.length) return;
  const tid = await pick("Who are you naming?", targets.map(t=>{ const why=eligibility(a,t); return {label:chip(t), sub:why||(nobodyHolds(t)?"Nobody else holds their tokens: anyone may name them":`You hold ${countColor(a,t.id)} of their tokens`), value:t.id, disabled:!!why}; }),
    {body:`<p class="muted">You need at least 1 of their tokens, and no other player may hold more. If no other player holds any of their tokens, anyone may name them.</p>`});
  if (tid==null) return;
  const t = P(tid);
  if (eligibility(a,t)) return;
  const br = baseRole(a);
  const acts = [];
  if (br!=="Marquis") acts.push({label:"Bind", sub:"They stay in under you; take all their cards and souls and 1 of their tokens", value:"enslave"});
  if (br!=="Prince") acts.push({label:"Devour", sub:"They're out; take all their cards and souls and half their tokens, plus 4 souls", value:"consume"});
  acts.push({label:"Cancel", kind:"quiet", value:null});
  let act = await ask({title:`Announce: what will you do to ${esc(t.name)}?`, body:`<p class="muted">Say it out loud before naming.</p>`, options:acts});
  if (!act) return;
  const guess = await pickName(`Name ${esc(t.name)}`, `You announced <b>${act}</b>. Pick the demon you think ${esc(t.name)} is.`);
  if (!guess) return;
  log(`${a.name} named ${t.name} as ${NAME_OF[guess]} and announced "${act}".`);
  if (keyOf(guess)===keyOf(t.combo)){
    t.revealed = true;
    // A Prince who names the Marquis correctly consumes them (a Prince can't enslave a Marquis); anyone else marks them.
    const princeTakesMarquis = baseRole(t)==="Marquis" && (baseRole(a)==="Prince" || CFG.MARQUIS_INSTANT);   // sim variant: anyone who names the Marquis devours it at once
    if (princeTakesMarquis){
      act = "consume";
      log(`Correct. ${t.name} is the Marquis and can't be bound, so ${a.name} (Prince) will devour them.`);
      await info(`${esc(t.name)} is the Marquis`, `Correct! ${esc(t.name)} is ${NAME_OF[t.combo]}, the Marquis, who can't be bound. As the Prince, you devour them instead.`);
    } else if (baseRole(t)==="Marquis"){
      t.markedBy = a.id;
      await announce(`${esc(t.name)} is named`, `${esc(a.name)} named ${esc(t.name)} correctly: ${NAME_OF[t.combo]}, the Marquis. The Marquis is marked, and anyone but a Prince may now pay ${MARQUIS_KILL} souls to devour them.`);
      log(`Correct. ${t.name} is the Marquis and cannot be bound. ${t.name} is now marked: anyone except a Prince may devour them for ${MARQUIS_KILL} souls, and their cards go to ${a.name}.`);
      const affordable = onTurn ? canSpend(a,MARQUIS_KILL) : a.souls>=MARQUIS_KILL;
      const go = await ask({title:`${esc(t.name)} is the Marquis`, body:`<p>Correct! ${chip(t)} is ${NAME_OF[t.combo]}, the Marquis. They keep playing until someone pays ${MARQUIS_KILL} souls to devour them. Their cards go to you.</p>`,
        options:[{label:"Devour now", sub:`${MARQUIS_KILL} souls`, value:true, kind:"primary", disabled:!affordable},{label:"Later", value:false}]});
      if (go) await killMarquis(a, t, onTurn);
      return;
    }
    if (await offerWard(t, `${esc(a.name)} named you correctly and announced ${act==="enslave"?"bind":"devour"}.`)){
      addClaim({target:t.id, claimant:a.id, act, kind:"named", named:true});
      log(`${t.name} raised a Ward against a correct naming: ${a.name}'s ${act==="enslave"?"bind":"devour"} waits until the end of ${t.name}'s next turn.`);
      return;
    }
    if (!princeTakesMarquis) log(`Correct.`);
    captureWhy = `${a.name} named ${t.name} correctly`;
    try { await applyAction(a, t, act); } finally { captureWhy = null; }
  } else {
    log(`Wrong. ${t.name} decides what happens to ${a.name}.`);
    await announce("Wrong name", `${esc(a.name)} named ${esc(t.name)} as ${NAME_OF[guess]}, and was wrong. ${esc(t.name)} now decides ${esc(a.name)}'s fate.`);
    captureWhy = `${a.name} named ${t.name} wrongly`;
    try { await chooseFate(t, a, `${esc(t.name)} decides`); } finally { captureWhy = null; }
  }
}

async function killMarquis(payer, m, onTurn){
  if (activeClaim(m) || m.markedBy==null) return;
  if (onTurn) spend(payer,MARQUIS_KILL); else payer.souls-=MARQUIS_KILL;
  log(`${payer.name} paid ${MARQUIS_KILL} souls to devour the marked Marquis ${m.name}.`);
  if (await offerWard(m, `${esc(payer.name)} paid ${MARQUIS_KILL} souls to devour you.`)){
    addClaim({target:m.id, claimant:payer.id, act:"consume", kind:"marquis", named:true});
    log(`${m.name} raised a Ward against a paid devour: it waits until the end of ${m.name}'s next turn.`);
    return;
  }
  await consume(payer, m, P(m.markedBy));
}

/* ---------- Ward claims ----------
   A Ward turns a bind or devour into a claim that waits until the end of the target's next turn. Meanwhile the target
   plays normally but can't be named or paid-devoured. If the claimant is captured, the claim passes to whoever did it;
   if the target captures the claimant, the claim ends (and they're reborn if they had been named). */
const activeClaim = t => (S.claims||[]).find(c=>c.target===t.id && c.status==="waiting");
async function offerWard(t, why){
  if (countCard(t,"Ward")<3 || t.status==="dead") return false;
  await info(`Pass the device to ${esc(t.name)}`, `Only ${esc(t.name)} should look at the next screen.`);
  const use = await ask({title:`${esc(t.name)}: discard 3 Wards to delay it?`, body:`<p>${why} You hold ${countCard(t,"Ward")} Wards. If you discard 3, it waits until the end of your next turn, and until then no one else may name you or pay to devour you.</p>`,
    options:[{label:"Raise a Ward", value:true, kind:"primary"},{label:"Don't", value:false}]});
  if (!use) return false;
  discardN(t,"Ward",3);
  return true;
}
function addClaim(c){ S.claimSeq=(S.claimSeq||0)+1; S.claims.push({...c, id:S.claimSeq, status:"waiting", after:S.turnSerial}); }
async function claimsOnCapture(capturer, victim){
  for (const c of (S.claims||[]).filter(c=>c.status==="waiting")){
    if (c.target===victim.id){ c.status="void"; continue; }
    if (c.claimant!==victim.id) continue;
    const t = P(c.target);
    if (capturer.id===c.target){
      c.status="ended";
      log(`${t.name} took out ${victim.name}, who was claiming them: the claim ends${c.named?` and ${t.name} is reborn`:""}.`);
      if (c.named && t.status==="alive") await rebirth(t);
    } else {
      c.claimant = capturer.id; c.act = null;   // the new claimant chooses bind or devour when it resolves
      log(`${victim.name}'s claim on ${t.name} passes to ${capturer.name}.`);
    }
  }
}
async function resolveClaims(p){
  for (const c of (S.claims||[]).filter(c=>c.status==="waiting" && c.target===p.id && S.turnSerial > c.after)){
    if (p.status==="dead"){ c.status="void"; continue; }
    if (countCard(p,"Ward")>=3){
      const again = await ask({title:`${esc(p.name)}: discard 3 more Wards to delay again?`, body:`<p>The claim on you resolves now unless you discard 3 more Wards (you hold ${countCard(p,"Ward")}).</p>`,
        options:[{label:"Delay again", value:true, kind:"primary"},{label:"Let it happen", value:false}]});
      if (again){ discardN(p,"Ward",3); c.after=S.turnSerial; log(`${p.name} discarded 3 more Wards: the claim waits until the end of their next turn.`); continue; }
    }
    c.status="done";
    if (c.kind==="selfpact"){ log(`${p.name}'s Ward runs out.`); await selfPactDevour(p, c.spec, c.by, c.terms); continue; }
    const cl = P(c.claimant);
    if (!cl || cl.status!=="alive"){ c.status="void"; log(`The claim on ${p.name} lapses: ${cl?cl.name:"the claimant"} can't enforce it.`); continue; }
    log(`${p.name}'s Ward runs out: ${cl.name}'s claim resolves.`);
    if (c.kind==="marquis" && p.markedBy!=null) await consume(cl, p, P(p.markedBy));
    else if (c.act) await applyAction(cl, p, c.act);
    else await chooseFate(cl, p, `${esc(cl.name)} decides`);
  }
}

/* ---------- drawing ---------- */
function refillDeck(){
  if (!S.deck.length && S.discard.length){ S.deck = shuffle(S.discard.splice(0)); log("The event deck ran out and was reshuffled."); }
}
// depth counts redraws from unusable Insubordinations, so a deck of nothing but Insubordinations can't loop forever
async function drawEvent(p, depth=0){
  refillDeck();
  if (!S.deck.length){ await info("No cards", "The event deck and discard pile are both empty."); return; }
  const c = S.deck.shift();
  await onDrawn(p, c, depth);
}
async function onDrawn(p, c, depth=0){
  if (c==="Welfare"){ log(`${p.name} drew Welfare.`); await runEqualizer(); S.discard.push(c); }
  else if (c==="Meta"){ log(`${p.name} drew Meta.`); S.discard.push(c); await info("Meta", `${esc(p.name)} must immediately verbally/physically assault a player of their choice.`); }
  else if (c==="Insubordination"){ log(`${p.name} drew Insubordination.`); await runRebellion(p, depth); }
  else if (c==="Arrogation"){ await runAscension(p); }
  else { p.events.push(c); log(`${p.name} drew an event card.`); await ask({title:`You drew: ${c}`, body:`<div class="drawn">${cardFace(c)}</div>`, options:[{label:"OK", kind:"primary", value:true}]}); }
}
function drawToken(p){
  if (!S.bag.length) return null;
  const t = takeRandom(S.bag); p.tokens.push(t); return t;
}

// Welfare variants (sim only for now): "poorest" = everyone with souls gives 1 to the lowest net worth (the rules);
// "richest" = the player with the most souls pays WELFARE_PAY to each other player (not to their own thralls).
const WELFARE = CFG.WELFARE ?? "poorest";   // the rules: everyone gives 1 soul to the non-thrall with the lowest net worth
const WELFARE_PAY = CFG.WELFARE_PAY ?? 1;
async function runEqualizer(){
  if (WELFARE === "networth") return runWelfareNetWorth();
  if (WELFARE === "half" || WELFARE === "double" || WELFARE === "double-split") return runWelfareHalf();
  if (WELFARE !== "poorest") return runWelfareTax();
  const al = alive();
  const nw = new Map(al.map(p=>[p.id, netWorth(p)]));
  // only players who aren't thralls can receive (a thrall's souls would go straight to their binder)
  const free = al.filter(p=>p.status==="alive");
  const min = Math.min(...free.map(p=>nw.get(p.id)));
  const low = free.filter(p=>nw.get(p.id)===min);
  const others = al.filter(p=>!low.includes(p));
  const givers = others.filter(p=>p.souls>0);
  givers.forEach(g=>g.souls--);
  const T = givers.length, each = Math.floor(T/low.length), rem = T % low.length;
  low.forEach(l=>l.souls+=each);
  let note = "";
  if (rem){
    const others2 = others.filter(p=>p.status==="alive");
    if (others2.length){ const m2=Math.min(...others2.map(p=>nw.get(p.id))); const second=others2.find(p=>nw.get(p.id)===m2); second.souls+=rem; note=` The leftover ${rem} went to ${second.name} (second lowest).`; }
    else { low[0].souls+=rem; }
  }
  const lowNames = low.map(p=>p.name).join(" and ");
  const msg = T ? `${lowNames} (net worth ${min}) collected ${T} soul${T===1?"":"s"}${low.length>1?`, ${each} each`:""}.${note}` : `${lowNames} had the lowest net worth, but nobody else had souls to give.`;
  log(`Welfare: ${msg}`);
  await info("Welfare", esc(msg));
}
// "networth": among players who aren't thralls, if the highest net worth is at least twice the next-highest, that player
// gives away half their souls (rounded down), split evenly among the other non-thralls; leftovers go to the lowest net
// worth first, ties broken in turn order (starting with the player whose turn it is).
async function runWelfareNetWorth(){
  const free = alive().filter(p=>p.status==="alive");
  const sorted = [...free].sort((a,b)=>netWorth(b)-netWorth(a));
  const top = sorted[0], second = sorted[1];
  if (!top || !second || netWorth(top)===netWorth(second) || netWorth(top) < (CFG.WELFARE_MULT ?? 2)*netWorth(second) || top.souls < 2){
    log(`Welfare: ${top?top.name:"P?"} had ${top?top.souls:0} souls and paid 0. Nobody is far enough ahead, so nothing happens.`);
    await info("Welfare", "Nobody has at least twice the net worth of the next player, so nothing happens."); return;
  }
  const n = Math.floor(top.souls/2), before = top.souls;
  const order = seatOrderFrom(S.current);
  const to = free.filter(p=>p.id!==top.id);
  const each = Math.floor(n/to.length); let left = n - each*to.length;
  to.forEach(p=>p.souls+=each);
  const byNeed = [...to].sort((a,b)=>netWorth(a)-netWorth(b) || order.indexOf(a.id)-order.indexOf(b.id));
  for (const p of byNeed){ if (!left) break; p.souls++; left--; }
  top.souls -= n;
  log(`Welfare: ${top.name} had ${before} souls and paid ${n}. ${top.name}'s net worth (${netWorth(top)+n}) is at least twice the next player's, so they share half their souls among the others.`);
  await info("Welfare", `${esc(top.name)} has at least twice the net worth of anyone else and shares half their souls (${n}) among the other players.`);
}
// Simple variants: the player with the most souls gives half of them (rounded down) to the non-thrall player with the fewest.
//   "half":   always    "double": only if they have at least twice as many souls as every other player
async function runWelfareHalf(){
  const al = alive(), free = al.filter(p=>p.status==="alive");
  const sorted = [...al].sort((a,b)=>b.souls-a.souls);
  const rich = sorted[0], next = sorted[1] ? sorted[1].souls : 0;
  const poorCands = free.filter(p=>p.id!==rich.id);
  if (!rich || rich.souls<=0 || !poorCands.length){ log("Welfare: nothing happens."); await info("Welfare","Nothing happens."); return; }
  if (sorted.filter(p=>p.souls===rich.souls).length>1 || (WELFARE!=="half" && rich.souls < 2*next)){
    log(`Welfare: ${rich.name} had ${rich.souls} souls and paid 0. Nobody is far enough ahead, so nothing happens.`);
    await info("Welfare", WELFARE==="double" ? "Nobody has at least twice as many souls as everyone else, so nothing happens." : "Players are tied for the most souls, so nothing happens.");
    return;
  }
  const n = Math.floor(rich.souls/2), before = rich.souls;
  if (WELFARE === "double-split"){
    // "double-split": the half is shared out one soul at a time among every other non-thrall player
    let left = n; rich.souls -= n;
    for (let k=0; left>0; k++){ poorCands[k % poorCands.length].souls++; left--; }
    log(`Welfare: ${rich.name} had ${before} souls and paid ${n}. ${rich.name} shares half their souls (${n}) among ${poorCands.map(p=>p.name).join(", ")}.`);
    await info("Welfare", `${esc(rich.name)} has at least twice as many souls as anyone else and shares half of them (${n}) among the other players.`);
    return;
  }
  const min = Math.min(...poorCands.map(p=>p.souls)), poor = poorCands.find(p=>p.souls===min);
  rich.souls -= n; poor.souls += n;
  log(`Welfare: ${rich.name} had ${before} souls and paid ${n}. ${rich.name} gives half their souls (${n}) to ${poor.name}, who had the fewest.`);
  await info("Welfare", `${esc(rich.name)} has the most souls and gives half of them (${n}) to ${esc(poor.name)}, who has the fewest.`);
}
// Leader-pays Welfare variants:
//   "richest":  the player with the most souls pays WELFARE_PAY to each other player
//   "lead":     the player with the most souls gives away half their lead over the second-richest, spread over the others
//   "captures": the player with the most captures (thralls held + players devoured) pays WELFARE_PAY to each other player
// Nobody pays their own thralls (those souls would go straight back to them).
async function runWelfareTax(){
  const al = alive();
  let payer = null, budget = 0, why = "";
  if (WELFARE === "captures"){
    const score = p => slavesOf(p).length + (p.devours||0);
    const max = Math.max(...al.map(score));
    if (max > 0){ payer = al.find(p=>score(p)===max); why = `the most captures (${max})`; }
  } else {
    const sorted = [...al].sort((a,b)=>b.souls-a.souls);
    if (sorted[0] && sorted[0].souls > 0){
      payer = sorted[0];
      if (WELFARE === "lead"){ const lead = payer.souls - (sorted[1] ? sorted[1].souls : 0); budget = Math.floor(lead/2); why = `the most souls, ${lead} ahead of the next player`; }
      else why = `the most souls (${payer.souls})`;
    }
  }
  if (!payer){ log("Welfare: nobody qualifies to pay."); await info("Welfare", WELFARE==="captures" ? "Nobody has captured anyone yet, so nothing happens." : "Nobody has souls to share."); return; }
  const to = al.filter(p=>p.id!==payer.id && !(p.status==="slave" && p.master===payer.id));
  const before = payer.souls; let paid = 0;
  if (WELFARE === "lead"){
    for (let k=0; budget>0 && payer.souls>0 && to.length; k++){ to[k % to.length].souls++; payer.souls--; budget--; paid++; }
  } else {
    for (const r of to){ const n=Math.min(WELFARE_PAY, payer.souls); if (!n) break; payer.souls-=n; r.souls+=n; paid+=n; }
  }
  const msg = `${payer.name} has ${why} and pays out ${paid} soul${paid===1?"":"s"} to the other players.`;
  log(`Welfare: ${payer.name} had ${before} souls and paid ${paid}. ${msg}`);
  await info("Welfare", esc(msg));
}

async function runRebellion(p, depth=0){
  const slaves = S.players.filter(x=>x.status==="slave");
  const usable = slaves.filter(x=>!x.rebelBlocked.includes(x.master));
  if (!usable.length){
    const why = slaves.length ? "Every thrall has already failed a rebellion against their binder" : "There are no thralls";
    // Discarded, not shuffled back: shuffling it back could leave a deck of unusable Insubordinations that never empties,
    // so the discard pile (and its Seize cards) never came back into play.
    // ...and the drawer gets a replacement card, so an unusable Insubordination isn't a wasted purchase.
    S.discard.push("Insubordination");
    const redraw = depth < 3;
    log(`${why}, so Insubordination was discarded${redraw?` and ${p.name} draws another card`:""}.`);
    await info("Insubordination", `${why}, so the card is discarded${redraw?" and you draw another card":""}.`);
    if (redraw) await drawEvent(p, depth+1);
    return;
  }
  S.discard.push("Insubordination");
  await rebellion(p, "Insubordination");
}
// A rebellion: the drawer gives the card to a thrall who may try to name their binder (no token requirement).
async function rebellion(p, card){
  const slaves = S.players.filter(x=>x.status==="slave");
  const usable = slaves.filter(x=>!x.rebelBlocked.includes(x.master));
  const sid = await pick(`${card}: give it to a thrall`, slaves.map(s=>({label:`${chip(s)} <span class="muted">thrall of ${esc(P(s.master).name)}</span>`, sub:s.rebelBlocked.includes(s.master)?"Already failed against this binder":"", value:s.id, disabled:!usable.includes(s)})), {cancel:null});
  if (sid==null) return;
  const s=P(sid), m=P(s.master);
  log(`${p.name} gave ${card} to ${s.name}, who may name their binder ${m.name}.`);
  const guess = await pickName(`${esc(s.name)}: name your binder ${esc(m.name)}`, "Cancel to decline the rebellion.", s.id);
  if (!guess){ log(`${s.name} declined to rebel.`); return; }
  if (keyOf(guess)===keyOf(m.combo)){
    m.revealed=true;
    S.players.forEach(x=>{ if (x.status==="slave" && x.master===m.id && x.id!==s.id) x.master=s.id; });
    s.status="alive"; s.master=null;
    m.status="slave"; m.master=s.id;
    log(`${card} succeeded: ${s.name} named ${m.name} as ${NAME_OF[m.combo]}. ${s.name} is now the binder and ${m.name} the thrall; ${m.name}'s other thralls now serve ${s.name}.`);
    await announce(`${card} succeeded`, `${esc(s.name)} named their binder ${esc(m.name)} correctly (${NAME_OF[m.combo]}, the ${baseRole(m)}). They switch places, and ${esc(s.name)} is reborn with a new secret name.`);
    await rebirth(s);
  } else {
    const ec=s.events.length, tc=s.tokens.length;
    m.events.push(...s.events.splice(0)); m.tokens.push(...s.tokens.splice(0));
    s.rebelBlocked.push(m.id);
    log(`${card} failed: ${s.name} guessed ${NAME_OF[guess]} and gave ${m.name} all ${ec} event cards and ${tc} tokens.`);
    await announce(`${card} failed`, `${esc(s.name)} named their binder ${esc(m.name)} wrongly, gives them all their cards and tokens, and can never rebel against them again.`);
  }
}

async function rebirth(p){
  await info(`Pass the device to ${esc(p.name)}`, `${esc(p.name)} is free and chooses a new secret name. Only ${esc(p.name)} should see the next screen.`);
  const old = p.combo;
  const grid = namesGrid(true).replace(`data-v="${old}"`, `data-v="${old}" disabled title="Your old name"`);
  const c = await ask({title:`${esc(p.name)}: choose your new name`, body:`<p>Any name except your old one, ${NAME_OF[old]}. Your role becomes whatever the new name gives.</p>${grid}`});
  p.combo = keyOf(c);
  const fresh = shuffle([...p.combo].map(Number));
  let k = 0;
  [...S.players.map(x=>x.tokens), S.bag].forEach(arr=>arr.forEach(t=>{ if (t.owner===p.id && t.dots>0){ t.dots = fresh[k % fresh.length]; k++; } }));
  p.revealed=false; p.archUses=0;
  log(`${p.name} was reborn with a new secret name. Every ${p.name} token, in hands and in the bag, was replaced with a piece of the new name.`);
  await info(`Your new name: ${NAME_OF[p.combo]}`, `You are now the ${baseRole(p)}. Pass the device back to the table.`);
}

async function runArrogationMerged(p){
  const duke = baseRole(p)==="Duke";
  const canRebel = S.players.some(x=>x.status==="slave" && !x.rebelBlocked.includes(x.master));
  const mustShow = ARROGATION_MERGE==="forced" && canRebel;
  const opts = [];
  if (duke) opts.push({label:"Keep it in your hand", sub:"While you hold it, you have the Archduke's question", value:"keep", kind:"primary"});
  if (canRebel) opts.push({label:"Show it: give it to a thrall", sub:"They may try to name their binder", value:"show", kind:duke?"":"primary"});
  if (!mustShow){
    opts.push({label:"Put it back into the deck", sub:"Anywhere you choose", value:"back"});
    opts.push({label:"Discard it", sub:"Into the discard pile", value:"discard"});
  }
  const v = opts.length===1 ? opts[0].value : await ask({title:"You drew Arrogation", body:`<p>${duke?"As a Duke you may keep it. ":""}${mustShow?"Otherwise a thrall could use it, so you must give it to one.":canRebel?"You may give it to a thrall, who may then try to name their binder.":"No thrall can use it."}</p>`, options:opts});
  if (v==="keep"){ p.events.push("Arrogation"); log(`${p.name} drew an event card.`); }
  else if (v==="show"){ log(`${p.name} drew Arrogation and showed it.`); S.discard.push("Arrogation"); await rebellion(p, "Arrogation"); }
  else if (v==="discard"){ S.discard.push("Arrogation"); log(`${p.name} drew Arrogation and discarded it.`); }
  else { log(`${p.name} drew Arrogation.`); await putBackAscension(p); }
}
async function putBackAscension(p){
  const n = S.deck.length;
  const pos = await ask({title:"Arrogation: put it back", body:`<p>Choose where it goes in the event deck (${n} card${n===1?"":"s"} now). 1 is the top.</p>
    <p style="margin-top:10px"><label for="asc-pos" class="label">Position</label><input type="text" id="asc-pos" inputmode="numeric" value="${n+1}"></p>`,
    options:[{label:"Top", value:0},{label:"Bottom", value:n},{label:"Random", value:rand(n+1)},{label:"Use the position above", kind:"primary", read:m=>{ const v=parseInt(m.querySelector("#asc-pos").value,10); if(!(v>=1&&v<=n+1)) return {error:`Enter a number from 1 to ${n+1}.`}; return {value:v-1}; }}]});
  S.deck.splice(pos,0,"Arrogation");

//   "forced":   a Duke may keep it; otherwise, if a thrall could use it, you must give it to one (a rebellion); otherwise put it back or discard it

// Token rounds (sim variant only, TOKEN_ROUNDS: true): tokens only in odd rounds until the bag first empties.

// With SLAVE_SOULS_TO_MASTER, any soul a slave ends up with (Collect card, trade, Prince purchase, Welfare...) goes to their master.
function slaveSoulSweep(){
  if (!SLAVE_SOULS_TO_MASTER) return;
  S.players.forEach(x=>{ if (x.status==="slave" && x.souls>0){ const m=P(x.master); m.souls+=x.souls; log(`${x.name}'s ${x.souls} soul${x.souls===1?"":"s"} went to their binder ${m.name}.`); x.souls=0; } });

async function capSweep(){

async function selectiveDraw(p, cost, n, keep, fromCard=false){
  if (!S.bag.length) return;
  if (!fromCard){
    if (S.tokenBought || !tokenRound() || !canSpend(p,cost) || atCap(p)) return;
    spend(p,cost); S.tokenBought=true;
  }
  const drawn=[]; for (let i=0;i<n && S.bag.length;i++) drawn.push(takeRandom(S.bag));
  const k=Math.min(keep, drawn.length);
  let keepIdx = drawn.map((_,i)=>i);
  if (drawn.length>k){
    keepIdx = await ask({title:`Keep ${k} of ${drawn.length}`, body:`<p class="muted">Tokens stay dot side down, so you choose by color only. The rest go back into the bag unseen.</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${drawn.map((t,i)=>`<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="kd${i}" data-k="${i}"> ${tokHTML(0,P(t.owner).color,true)} ${esc(P(t.owner).name)}'s token${t.owner===p.id?" (yours)":""}</label>`).join("")}</div>`,
      options:[{label:"Keep these", kind:"primary", read:m=>{ const sel=[...m.querySelectorAll("input[data-k]:checked")].map(x=>+x.dataset.k); return sel.length===k?{value:sel}:{error:`Choose exactly ${k}.`}; }}]});
  }
  const kept = drawn.filter((_,i)=>keepIdx.includes(i));
  drawn.forEach((t,i)=>{ if (keepIdx.includes(i)) p.tokens.push(t); else S.bag.push(t); });
  log(`${p.name} ${fromCard?"played Scrying":`paid ${cost} souls`}, drew ${drawn.length} name token${drawn.length===1?"":"s"} and kept ${k}.`);
  await info("You kept", `<span class="toks">${kept.map(t=>`${tokHTML(t.dots,P(t.owner).color)} <span>${esc(P(t.owner).name)}'s token, ${dotWord(t.dots)}</span>`).join(" ")}</span>`);
}

ACT.playContract = async () => {

function cardChecks(p, prefix){

  return `<div style="display:flex;flex-direction:column;gap:6px">${p.events.map((c,i)=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="${prefix}${i}" data-idx="${i}"> ${c}</label>`).join("")}</div>`;

function tokenChecks(p, prefix){
  if (!p.tokens.length) return `<p class="muted">No name tokens.</p>`;
  return `<div style="display:flex;flex-direction:column;gap:6px">${p.tokens.map((t,i)=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="${prefix}t${i}" data-tidx="${i}"> ${tokHTML(t.dots,P(t.owner).color)} ${esc(P(t.owner).name)}, ${dotWord(t.dots)}</label>`).join("")}</div>`;

function readSide(m, prefix, maxSouls){
  const s = parseInt(m.querySelector(`#${prefix}souls`).value||"0",10);
  if (!(s>=0 && s<=maxSouls)) return {error:`Souls must be a whole number from 0 to ${maxSouls}.`};
  const idx = [...m.querySelectorAll(`input[data-idx][id^="${prefix}"]:checked`)].map(x=>+x.dataset.idx);
  const tidx = [...m.querySelectorAll(`input[data-tidx][id^="${prefix}"]:checked`)].map(x=>+x.dataset.tidx);
  return {value:{souls:s, idx, tidx}};
}
const tokList = ts => ts.map(t=>`${P(t.owner).name} ${t.dots>0?t.dots+"-dot":"blank"}`).join(", ");   // private: only for the player now holding them
const tokColors = ts => ts.map(t=>`1 ${P(t.owner).name} token`).join(", ");        // public: colors only

ACT.trade = async () => {
  const p=me(); if (p.status!=="alive") return;   // thralls can't trade
  const items = S.players.filter(o=>o.id!==p.id && o.status!=="dead").map(o=>{
    let why = o.status==="slave" ? "Thralls can't trade" : null;
    return {label:chip(o), sub:why||"", value:o.id, disabled:!!why};
  });
  const oid = await pick("Trade with…", items, {body:`<p class="muted">Agree on the trade out loud first. Each name token traded costs both of you ${TRADE_FEE} souls (paid to the bank) and is passed face down. Promises about later turns aren't binding without a Pact.</p>`});
  if (oid==null) return;
  const o=P(oid);
  const myMax = Math.max(0, Math.min(p.souls, SPEND_CAP - S.spent));
  const give = await ask({title:`What you give ${esc(o.name)}`,
    body:`<p><label class="label" for="tg-souls">Souls · you have ${myMax}${SPEND_CAP<Infinity?" you can spend this turn":""}, including trade fees</label><input type="text" id="tg-souls" inputmode="numeric" value="0"></p>
      <p class="label" style="margin-top:12px">Event cards (passed face down)</p>${cardChecks(p,"tg-")}
      ${p.status==="slave"?`<p class="muted" style="margin-top:12px">Thralls can't trade away name tokens.</p>`:`<p class="label" style="margin-top:12px">Name tokens (${TRADE_FEE} souls each for both of you, passed face down)</p>${tokenChecks(p,"tg-")}`}`,
    options:[{label:`Next: pass to ${esc(o.name)}`, kind:"primary", read:m=>{ const r=readSide(m,"tg-",myMax); if (r.error) return r; if (r.value.souls + TRADE_FEE*r.value.tidx.length > myMax) return {error:`That's more than the ${myMax} souls you can spend.`}; return r; }},{label:"Cancel", kind:"quiet", value:null}]});
  if (!give) return;
  const offered = give.idx.map(i=>p.events[i]);
  const offeredToks = give.tidx.map(i=>p.tokens[i]);
  await info(`Pass the device to ${esc(o.name)}`, `Only ${esc(o.name)} should see the next screen.`);
  const offerText = describeGive(give.souls, offered) + (offeredToks.length?` and face-down tokens: ${tokColors(offeredToks)}`:"");
  const back = await ask({to:o.id, title:`${esc(o.name)}: ${esc(p.name)} offers ${esc(offerText)}`,
    body:`<p><label class="label" for="tb-souls">Souls you give back</label><input type="text" id="tb-souls" inputmode="numeric" value="0"></p>
      <p class="label" style="margin-top:12px">Event cards you give back</p>${cardChecks(o,"tb-")}
      ${o.status==="slave"?`<p class="muted" style="margin-top:12px">Thralls can't trade away name tokens.</p>`:`<p class="label" style="margin-top:12px">Name tokens you give back (${TRADE_FEE} souls each for both of you)</p>${tokenChecks(o,"tb-")}`}`,
    options:[{label:"Accept trade", kind:"primary", read:m=>{
        const r=readSide(m,"tb-",o.souls); if (r.error) return r;
        const fee = TRADE_FEE*(give.tidx.length + r.value.tidx.length);
        const pNet = r.value.tidx.length - give.tidx.length;   // tokens p gains (o gains the opposite)
        if (pNet>0 && pNet>capRoom(p)) return {error:`${p.name} can't take ${pNet} more token${pNet===1?"":"s"}: it would put them over their holding cap (${p.tokens.length}/${capOf(p)}).`};
        if (pNet<0 && -pNet>capRoom(o)) return {error:`You can't take ${-pNet} more token${pNet===-1?"":"s"}: it would put you over your holding cap (${o.tokens.length}/${capOf(o)}).`};
        if (r.value.souls + fee > o.souls) return {error:`You need ${r.value.souls + fee} souls for this (including ${fee} in token fees) but have ${o.souls}.`};
        if (give.souls + fee > myMax) return {error:`${p.name} can only spend ${myMax} souls this turn, and this trade would cost them ${give.souls + fee} including ${fee} in token fees.`};
        return r; }},
      {label:"Decline", kind:"quiet", value:null}]});
  if (!back){
    log(`${o.name} declined a trade with ${p.name}.`);
    await info(`Pass the device back to ${esc(p.name)}`, `${esc(o.name)} declined the trade.`);
    return;
  }
  const fee = TRADE_FEE*(give.tidx.length + back.tidx.length);
  const pCards = [...give.idx].sort((a,b)=>b-a).map(i=>p.events.splice(i,1)[0]);
  const oCards = [...back.idx].sort((a,b)=>b-a).map(i=>o.events.splice(i,1)[0]);
  const pToks = [...give.tidx].sort((a,b)=>b-a).map(i=>p.tokens.splice(i,1)[0]);
  const oToks = [...back.tidx].sort((a,b)=>b-a).map(i=>o.tokens.splice(i,1)[0]);
  spend(p, give.souls + fee);
  o.souls += give.souls;
  o.souls -= back.souls + fee; p.souls += back.souls;
  p.events.push(...oCards); o.events.push(...pCards);
  p.tokens.push(...oToks); o.tokens.push(...pToks);
  log(`${p.name} and ${o.name} traded. ${p.name} gave ${give.souls} soul${give.souls===1?"":"s"} and ${pCards.length} card${pCards.length===1?"":"s"}; ${o.name} gave ${back.souls} soul${back.souls===1?"":"s"} and ${oCards.length} card${oCards.length===1?"":"s"}.`);
  if (pToks.length || oToks.length){
    log(`Name tokens traded face down (each side paid ${fee} souls): ${p.name} gave ${pToks.length?tokColors(pToks):"none"}; ${o.name} gave ${oToks.length?tokColors(oToks):"none"}.`);
  }
  await info(`Pass the device back to ${esc(p.name)}`, `Trade done. You received ${esc(describeGive(back.souls, oCards))}${oToks.length?` and tokens: ${esc(tokList(oToks))}`:""}.`);
};
// Who is voting: online, the player who clicked; at a shared table, the button names the voter.
function voterOf(b){ return ONLINE ? S.actor : +b.dataset.who; }
// A Pact with yourself needs every other player's approval; a Pact with another player needs theirs.
function pactApprovers(c){ return c.b==null ? S.players.filter(x=>x.id!==c.a && x.status!=="dead").map(x=>x.id) : (P(c.b).status!=="dead" ? [c.b] : []); }
// Everyone still in the game (not devoured) gives a verdict on a Pact; it closes when all but one agree.
function pactJudges(){ return S.players.filter(x=>x.status!=="dead").map(x=>x.id); }
// Never fewer than 2: with only two players left, one of them alone could otherwise declare the other a breaker.
function pactNeeded(){ return Math.max(2, pactJudges().length - 1); }
function pactTally(c){ const t={}; for (const [k,v] of Object.entries(c.verdicts||{})) if (pactJudges().includes(+k)) t[v]=(t[v]||0)+1; return t; }
ACT.contractVote = async b => {
  const c=S.contracts.find(x=>x.id===+b.dataset.id); if (!c || c.status!=="pending") return;
  const who=voterOf(b); if (!pactApprovers(c).includes(who)) return;
  c.approvals[who] = b.dataset.v==="yes";
  if (!c.approvals[who]){
    c.status="rejected"; const a=P(c.a);
    if (a.status!=="dead") a.events.push("Pact"); else S.discard.push("Pact");
    log(`${P(who).name} rejected the Pact "${c.terms}". The Pact card goes back to ${a.name}.`);
    return;
  }
  log(`${P(who).name} approved the Pact "${c.terms}".`);
  if (pactApprovers(c).every(id=>c.approvals[id])){ c.status="active"; S.discard.push("Pact"); log(`The Pact is sealed: "${c.terms}".`); }
};
// A verdict is "kept", or the id of the player who broke it. Clicking your current verdict again takes it back.
ACT.contractVerdict = async b => {
  const c=S.contracts.find(x=>x.id===+b.dataset.id); if (!c || c.status!=="active") return;
  const who=voterOf(b); if (!pactJudges().includes(who)) return;
  const v = b.dataset.v==="kept" ? "kept" : +b.dataset.v;
  if (v!=="kept" && v!==c.a && v!==c.b) return;
  if (c.verdicts[who]===v){ delete c.verdicts[who]; return; }
  c.verdicts[who]=v;
  if ((pactTally(c)[v]||0) < pactNeeded()) return;
  if (v==="kept"){ c.status="kept"; log(`The table agrees the Pact was kept: "${c.terms}".`); return; }
  await breakPact(c, P(v), P(who));
};
async function breakPact(c, breaker, by){
  c.status="broken"; c.breaker=breaker.id;
  if (c.b==null){
    log(`The table agrees ${breaker.name} broke their Pact with themself: "${c.terms}".`);
    if (await offerWard(breaker, `You broke your Pact with yourself.`)){
      addClaim({target:breaker.id, claimant:null, kind:"selfpact", named:false, by:by.id, terms:c.terms});
      log(`${breaker.name} raised a Ward against a broken Pact: their devour waits until the end of their next turn.`);
      return;
    }
    await selfPactDevour(breaker, null, by.id, c.terms);
    return;
  }
  const executor=P(breaker.id===c.a?c.b:c.a);
  log(`The table agrees ${breaker.name} broke the Pact "${c.terms}".`);
  if (executor.status!=="alive"){ log(`${executor.name} is a thrall and can't enforce it.`); return; }
  if (await offerWard(breaker, `You broke your Pact with ${esc(executor.name)}.`)){
    addClaim({target:breaker.id, claimant:executor.id, act:null, kind:"pact", named:false});
    log(`${breaker.name} raised a Ward against a broken Pact: ${executor.name}'s punishment waits until the end of ${breaker.name}'s next turn.`);
    return;
  }
  await chooseFate(executor, breaker, `${esc(executor.name)} punishes ${esc(breaker.name)}`);
}
// The player whose verdict broke the Pact hands out the breaker's things as the written terms say.
async function pactForfeit(p, byId, terms){
  const recips = S.players.filter(o=>o.id!==p.id && o.status==="alive");
  const to = byId!=null && P(byId) && P(byId).status!=="dead" && byId!==p.id ? byId : (recips[0]||{}).id;
  const spec={};
  for (const [k, what] of [["souls","souls"],["cards","event cards"],["tokens","name tokens"],["thralls","thralls"]]){
    const v = await ask({to, title:`Who gets ${esc(p.name)}'s ${what}?`, body:`<p>Follow the Pact's terms:</p><p><q>${esc(terms||"")}</q></p><p class="muted">Only players who aren't thralls can receive.</p>`,
      options:[{label:"Split evenly among the other players", value:"split", kind:"primary"}, ...recips.map(o=>({label:chip(o), value:o.id}))]});
    spec[k] = v==null ? "split" : v;
  }
  return spec;
}
// Broken Pact with yourself: you are devoured. Your souls, cards, tokens and thralls go where the Pact said: to one player,
// or split one at a time among the other players who aren't thralls (in turn order after you). No devour bonus.
async function selfPactDevour(p, spec, byId, terms){
  spec = spec || await pactForfeit(p, byId, terms);
  const others = seatOrderFrom(p.id).map(P).filter(x=>x.id!==p.id && x.status==="alive");
  p.status="dead"; p.master=null; p.revealed=true;
  const dealer = key => { const who=spec[key]; const one = (who!=="split" && who!=null && P(who).status==="alive") ? P(who) : null; let k=0; return () => one || others[k++ % others.length]; };
  let next = dealer("souls"); const sv=p.souls; for (let i=0;i<sv && others.length;i++) next().souls++; p.souls=0;
  next = dealer("cards"); for (const c of p.events.splice(0)) { const r=next(); if (r) r.events.push(c); else S.discard.push(c); }
  next = dealer("tokens"); for (const t of shuffle(p.tokens.splice(0))) { const r=next(); if (r) r.tokens.push(t); else S.bag.push(t); }
  next = dealer("thralls"); for (const x of slavesOf(p)) { const r=next(); if (r) x.master=r.id; }
  S.players.forEach(x=>{ x.tokens=x.tokens.filter(t=>t.owner!==p.id); if (x.markedBy===p.id) x.markedBy=null; });
  S.bag=S.bag.filter(t=>t.owner!==p.id);
  voidPactsOf(p);
  (S.claims||[]).forEach(c=>{ if (c.status==="waiting" && (c.claimant===p.id || c.target===p.id)) c.status="void"; });
  S.queue = S.queue.filter(i=>i!==p.id);
  log(`${p.name} broke their Pact with themself and is devoured (${NAME_OF[p.combo]}, ${baseRole(p)}). Their souls, cards, tokens and thralls go where the Pact said.`);
  await announce(`${esc(p.name)} is devoured`, `${esc(p.name)} broke their Pact with themself and is devoured (${NAME_OF[p.combo]}, the ${baseRole(p)}). Everything they had goes where their Pact said.`);
}

ACT.endTurn = async () => {
  let it = topInt();
  if (it && S.current===it.target){
    while (it && S.current===it.target){
      const a=P(it.attacker), t=P(it.target);
      S.interrupts.pop();
      if (a.status==="alive" && t.status==="alive"){ log(`${t.name}'s ward turn ended; ${a.name}'s ${it.act} resolves.`); await applyAction(a,t,it.act); }
      else log(`${t.name}'s ward turn ended; ${a.name}'s attack no longer resolves.`);
      S.current=it.returnTo; S.spent=it.savedSpent; S.earlUsed=it.savedEarl; S.tokenBought=!!it.savedTok; S.view="handoff";
      if (checkWin()) return;
      // If we returned into an outer Ward turn whose owner was just consumed or enslaved, that turn is over too.
      it = topInt();
      if (!(it && S.current===it.target && P(S.current).status!=="alive")) break;
    }
    if (P(S.current).status==="dead" && !(topInt() && topInt().target===S.current)) nextTurn();
    return;
  }
  const ender = me();
  await resolveClaims(ender);
  if (S.phase!=="play" || checkWin()) return;
  log(`${ender.name} ended their turn.`);
  nextTurn();
};

function statusText(p){
  if (p.status==="dead") return `<span class="tag warn">Devoured</span> <span class="muted">${NAME_OF[p.combo]}, ${baseRole(p)}</span>`;
  const bits=[];
  if (p.status==="slave") bits.push(`<span class="tag">Thrall of ${esc(P(p.master).name)}</span>`);
  if (p.markedBy!=null) bits.push(`<span class="tag warn">Marked Marquis</span>`);
  const cl = activeClaim(p);
  if (cl) bits.push(`<span class="tag warn">Warded: ${cl.claimant!=null?`${esc(P(cl.claimant).name)}'s claim`:"own Pact"} waits</span>`);
  if (p.revealed && p.markedBy==null) bits.push(`<span class="tag gold">${baseRole(p)}</span>`);
  return bits.join(" ") || `<span class="muted">Hidden</span>`;
}
function tokenCounts(p){
  const by={}; p.tokens.forEach(t=>by[t.owner]=(by[t.owner]||0)+1);
  const keys=Object.keys(by);
  if (!keys.length) return `<span class="muted">none</span>`;
  return `<span class="held">${keys.map(k=>`<span class="grp" style="--pc:var(--c${P(+k).color})" title="${by[k]} of ${esc(P(+k).name)}'s tokens" aria-label="${by[k]} of ${esc(P(+k).name)}'s tokens">${'<span class="dot"></span>'.repeat(by[k])}</span>`).join("")}</span>`;
}

// Pacts tab: every Pact, its terms, and the votes. VIEWER is the player on this device online (null at a shared table,
// where each vote button names the player casting it). PACT_TAB is per device, not part of the game state.
let VIEWER = null, PACT_TAB = false;
const PACT_STATUS = {pending:"Waiting for approval", active:"In force", kept:"Kept", broken:"Broken", rejected:"Rejected", void:"Void (a party was bound or devoured)"};
function pactCard(c){
  const who = id => chip(P(id));
  const parties = `${who(c.a)} ${c.b==null?"<span class='muted'>with themself</span>":`<span class="muted">and</span> ${who(c.b)}`}`;
  const voters = list => VIEWER==null ? list : list.filter(id=>id===VIEWER);
  let body = "";
  if (c.status==="pending"){
    const need = pactApprovers(c);
    body = `<div class="muted" style="font-size:.9rem">Approved by: ${need.filter(id=>c.approvals[id]).map(who).join(" ")||"nobody yet"} · waiting on ${need.filter(id=>!c.approvals[id]).map(id=>esc(P(id).name)).join(", ")}</div>
      <div class="toolbar">${voters(need.filter(id=>!c.approvals[id])).map(id=>`<button class="btn small primary" data-act="contractVote" data-id="${c.id}" data-who="${id}" data-v="yes">${VIEWER==null?esc(P(id).name)+" approves":"Approve"}</button><button class="btn small" data-act="contractVote" data-id="${c.id}" data-who="${id}" data-v="no">${VIEWER==null?esc(P(id).name)+" rejects":"Reject"}</button>`).join("")}</div>`;
  } else if (c.status==="active"){
    const t = pactTally(c), need = pactNeeded();
    const choices = [...(c.b==null?[[c.a,"Broken"]]:[[c.a,`${P(c.a).name} broke it`],[c.b,`${P(c.b).name} broke it`]]), ["kept","Kept"]];
    const label = v => v==="kept" ? "kept" : (c.b==null ? "broken" : `broken by ${P(v).name}`);
    const tally = choices.filter(([v])=>t[v]).map(([v])=>`${t[v]} of ${need} say ${esc(label(v))}`).join(" · ");
    body = `<div class="muted" style="font-size:.9rem">Closes when ${need} players agree. ${tally||"No verdicts yet."}</div>
      ${voters(pactJudges()).map(id=>`<div class="toolbar">${VIEWER==null?`<span class="label" style="align-self:center">${esc(P(id).name)}</span>`:""}${choices.map(([v,l])=>`<button class="btn small${c.verdicts[id]===v?" primary":""}" data-act="contractVerdict" data-id="${c.id}" data-who="${id}" data-v="${v}" aria-pressed="${c.verdicts[id]===v}">${esc(l)}</button>`).join("")}</div>`).join("")}`;
  } else if (c.status==="broken" && c.breaker!=null) body = `<div class="muted" style="font-size:.9rem">Broken by ${esc(P(c.breaker).name)}</div>`;
  return `<div class="contract ${c.status}"><div>${parties} <span class="tag${c.status==="active"?" gold":c.status==="broken"?" warn":""}">${PACT_STATUS[c.status]||c.status}</span> <span class="muted mono" style="font-size:.8rem">· round ${c.round}</span></div>
    <q>${esc(c.terms)}</q>${body}</div>`;
}
function pactsOpen(){ return (S.contracts||[]).filter(c=>c.status==="pending"||c.status==="active"); }

    <p class="muted">A Pact with yourself needs every other player's approval; a Pact with another player needs theirs. A Pact is kept or broken when every player but one agrees, and never fewer than two.</p>
    ${open.length?`<div class="contracts">${open.map(pactCard).join("")}</div>`:'<p class="muted">No open Pacts.</p>'}</section>

document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-act]"); if (b && b.tagName==="A") e.preventDefault();
  if (!b || b.disabled || busy || !$("#modal").hidden) return;
  const fn=ACT[b.dataset.act]; if (!fn) return;
  busy=true;
  try { await fn(b); await afterAction(); } catch(err){ console.error(err); }
  busy=false;
  if (S) save();
  render();
  if (["showTurn","hide","endTurn","lockPick","revealPick","setupStart","home","pactsTab"].includes(b.dataset.act)) window.scrollTo(0,0);
});

// After any action: thrall souls to binders, token-round check, win check, and skip a turn owner who was devoured.
async function afterAction(){
  if (!S || S.phase!=="play") return;
  slaveSoulSweep(); await capSweep();
  if (S.phase==="play" && !checkWin()){
    if (P(S.current).status==="dead" && !(topInt() && topInt().target===S.current)) nextTurn();
  }
}

// Online: each prompt goes to one player. These rules functions act on behalf of a specific player, so every prompt
// raised inside them goes to that player (S.promptTo); anything else goes to whoever took the action (S.actor).
const actingFor = (fn, who) => async function(...args){
  if (!S) return fn.apply(this, args);
  const prev = S.promptTo; S.promptTo = who(...args);
  try { return await fn.apply(this, args); } finally { if (S) S.promptTo = prev; }
};
enslave = actingFor(enslave, (master) => master.id);
consume = actingFor(consume, (killer, victim, receiver=killer) => receiver.id);
giftTokens = actingFor(giftTokens, (giver) => giver.id);
